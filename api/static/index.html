  <script>
    // ---- helper base64url <-> ArrayBuffer per WebAuthn ----
    function b64uToBuf(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); const pad = '='.repeat((4 - s.length % 4) % 4); const bin = atob(s + pad); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++)b[i] = bin.charCodeAt(i); return b.buffer; }
    function bufToB64u(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i++)s += String.fromCharCode(b[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

    function app() {
      return {
        token: localStorage.getItem('tdp_token') || '',
        // token scoped per le immagini (vita breve, scope='image').
        // Viaggia in query string negli <img src>, quindi NON deve essere il JWT pieno:
        // se finisce nei log nginx/NPMplus, dura poco e da' accesso solo alle immagini.
        imageToken: localStorage.getItem('tdp_image_token') || '',
        view: localStorage.getItem('tdp_view') || 'list',
        // login state
        step: 'pwd', user: '', pwd: '', code: '', err: '', methods: [], pendingToken: '', needs2faSetup: false,
        // app state
        q: '', flt: 'all', sites: [], showAdd: false, formErr: '', sel: null, edit: null, editErr: '', openGrps: [], bulkBusy: false, bulkMsg: '', massBusy: false, massMsg: '',
        // selezione multipla + tag/cartelle
        selMode: false, selIds: [], tagFilter: '',
        // pagine per cartella/tag: null = tutti i siti, 'ov' = panoramica, altro = nome tag ('__none' = senza cartella)
        page: null,
        // archivio connettori (Joomla/WP)
        showConn: false, connList: [], connBusy: false, connErr: '', connMsg: '', regKey: '',
        secBell: false,
        tagModal: null, tagInput: '', rmTags: [], tagBusy: false, tagMsg: '', tagErr: '',
        form: { name: '', url: '', cms: 'wp', admin_url: '', token: '', group: '', tags: '', poll_interval_minutes: 180, auto_update: false },
        // security modal
        show2fa: false, sec: { username: '', totp_enabled: false, passkeys: [] }, totpSetup: null, totpEnableCode: '', secErr: '',
        pwOld: '', pwNew: '', pwMsg: '', pwErr: '', userMsg: '', userErr: '',
        tgBusy: false, tgMsg: '', tgErr: '',
        // mass install plugin/tema
        showInstall: false, instBusy: false, instErr: '', instFile: null,
        instResults: [], instSummary: { ok: 0, failed: 0, total: 0 },
        inst: { cms: 'wp', kind: 'plugin', activate: true, sel: [], mode: 'install', rmItems: [], q: '', searchResults: [], searchBusy: false, searchErr: '', searched: false },

        h() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token }; },
        hp() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.pendingToken }; },
        setView(v) { this.view = v; localStorage.setItem('tdp_view', v); },

        // salva entrambi i token dopo un login andato a buon fine
        _setTokens(d) {
          this.token = d.token || '';
          localStorage.setItem('tdp_token', this.token);
          if (d.image_token) {
            this.imageToken = d.image_token;
            localStorage.setItem('tdp_image_token', this.imageToken);
          }
        },

        // chiede un nuovo image_token quando quello attuale scade (10 min).
        // L'endpoint richiede un JWT pieno valido, quindi rinfresca trasparentemente.
        async _refreshImageToken() {
          try {
            const r = await fetch('/api/image-token', { headers: this.h() });
            if (r.ok) {
              const d = await r.json();
              if (d.image_token) {
                this.imageToken = d.image_token;
                localStorage.setItem('tdp_image_token', this.imageToken);
              }
            }
          } catch (e) { /* niente da fare: l'<img> potra' fallire, e poi si rifa' al refresh */ }
        },

        async init() {
          // routing pagine cartella: leggi l'hash all'avvio e segui i cambi (back/forward inclusi)
          this._readHash();
          window.addEventListener('hashchange', () => this._readHash());
          if (this.token) {
            // Rinnova SEMPRE l'image_token all'avvio. Vive solo 10 min: se la tab e'
            // rimasta idle (PC in standby, tab in background col setInterval throttlato)
            // il token presente in localStorage e' scaduto. Il vecchio guard
            // "if (!this.imageToken)" rinnovava solo se ASSENTE, non se SCADUTO, e le
            // <img> finivano in 401 fino al primo tick degli 8 minuti.
            await this._refreshImageToken();
            // refresh trasparente ogni 8 minuti (token vive 10)
            setInterval(() => { if (this.token) this._refreshImageToken(); }, 8 * 60 * 1000);
            await this.load();
            this.loadSecBell();
            // Auto-refresh della lista: senza, quando il worker aggiorna un sito in
            // background la dashboard resta ferma sui contatori vecchi finche' non ricarichi
            // a mano. Salto il tick se stai facendo qualcosa di bloccante (modale aperta)
            // per non farti ballare la UI sotto le mani.
            setInterval(() => {
              if (!this.token) return;
              if (this.showAdd || this.edit || this.showInstall || this.tagModal || this.show2fa || this.massBusy) return;
              this.load();
              this.loadSecBell();
            }, 60 * 1000);
          }
          this.$watch('show2fa', v => { if (v) this.loadSec(); });
        },

        // campanello Centro Sicurezza: rosso se c'e' una vulnerabilita' grave attiva
        async loadSecBell() {
          try {
            const r = await fetch('/api/security/summary', { headers: this.h() });
            if (r.ok) { const d = await r.json(); this.secBell = !!d.bell; }
          } catch(e) {}
        },

        // ---------- LOGIN ----------
        async login() {
          this.err = '';
          const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: this.user, password: this.pwd }) });
          if (r.status === 429) { this.err = 'Troppi tentativi. Riprova tra qualche minuto.'; return; }
          if (!r.ok) { this.err = 'Credenziali errate'; return; }
          const d = await r.json();
          if (d.token) {
            this._setTokens(d);
            this.needs2faSetup = !!d.needs_2fa_setup; this.pwd = '';
            await this.load(); return;
          }
          // serve 2fa
          this.pendingToken = d.token_pending; this.methods = d.methods || []; this.step = '2fa'; this.pwd = '';
        },
        async verifyTotp() {
          this.err = '';
          const r = await fetch('/api/2fa/totp/verify', { method: 'POST', headers: this.hp(), body: JSON.stringify({ code: this.code }) });
          if (r.status === 429) { this.err = 'Troppi tentativi. Riprova tra qualche minuto.'; return; }
          if (!r.ok) { this.err = 'Codice non valido'; return; }
          this._setTokens(await r.json());
          this.step = 'pwd'; this.code = ''; await this.load();
        },
        async loginPasskey() {
          this.err = '';
          try {
            const r = await fetch('/api/webauthn/login/begin', { method: 'POST', headers: this.hp() });
            if (!r.ok) { this.err = 'Errore avvio passkey'; return; }
            const opts = await r.json();
            opts.challenge = b64uToBuf(opts.challenge);
            if (opts.allowCredentials) opts.allowCredentials = opts.allowCredentials.map(c => ({ ...c, id: b64uToBuf(c.id) }));
            const cred = await navigator.credentials.get({ publicKey: opts });
            const payload = {
              id: cred.id, rawId: bufToB64u(cred.rawId), type: cred.type,
              response: {
                authenticatorData: bufToB64u(cred.response.authenticatorData),
                clientDataJSON: bufToB64u(cred.response.clientDataJSON),
                signature: bufToB64u(cred.response.signature),
                userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : null,
              },
            };
            const r2 = await fetch('/api/webauthn/login/complete', { method: 'POST', headers: this.hp(), body: JSON.stringify({ credential: payload }) });
            if (r2.status === 429) { this.err = 'Troppi tentativi. Riprova tra qualche minuto.'; return; }
            if (!r2.ok) { this.err = 'Passkey non valida'; return; }
            this._setTokens(await r2.json());
            this.step = 'pwd'; await this.load();
          } catch (e) { this.err = 'Passkey annullata o non disponibile'; }
        },
        logout() {
          this.token = ''; this.imageToken = ''; this.pendingToken = ''; this.step = 'pwd';
          localStorage.removeItem('tdp_token');
          localStorage.removeItem('tdp_image_token');
        },

        // ---------- DATI ----------
        async load() {
          const r = await fetch('/api/sites', { headers: this.h() });
          if (r.status === 401) { this.logout(); return; }
          this.sites = await r.json();
        },

        get filtered() {
          const q = this.q.trim().toLowerCase();
          let arr = this.sites.slice();
          // filtro rapido
          if (this.flt === 'upd') arr = arr.filter(s => this.hasUpd(s));
          else if (this.flt === 'off') arr = arr.filter(s => s.status && s.status !== 'ok');
          else if (this.flt === 'wp') arr = arr.filter(s => s.cms === 'wp');
          else if (this.flt === 'joomla') arr = arr.filter(s => s.cms === 'joomla');
          // pagina cartella attiva: filtra sul tag della pagina ('__none' = senza cartella)
          if (this.page && this.page !== 'ov') {
            if (this.page === '__none') arr = arr.filter(s => this.siteTags(s).length === 0);
            else { const pf = this.page.toLowerCase(); arr = arr.filter(s => this.siteTags(s).some(t => t.toLowerCase() === pf)); }
          } else if (this.tagFilter) {
            const tf = this.tagFilter.toLowerCase();
            arr = arr.filter(s => this.siteTags(s).some(t => t.toLowerCase() === tf));
          }
          // ricerca testo
          if (q) arr = arr.filter(s => (s.name + ' ' + s.url).toLowerCase().includes(q));
          // ordina: offline in cima, poi con update, poi ok; a parità per nome
          const rank = s => { if (s.status && s.status !== 'ok') return 0; if (this.hasUpd(s)) return 1; return 2; };
          arr.sort((a, b) => { const d = rank(a) - rank(b); return d !== 0 ? d : (a.name || '').localeCompare(b.name || ''); });
          return arr;
        },
        get mOk() { return this.sites.filter(s => s.status === 'ok').length; },
        get mUpd() { return this.sites.filter(s => this.hasUpd(s)).length; },
        get mErr() { return this.sites.filter(s => s.status && s.status !== 'ok').length; },
        get mAuto() { return this.sites.filter(s => s.auto_update).length; },

        // tutti i tag presenti coi conteggi, ordinati per nome (case-insensitive)
        get allTags() {
          const map = new Map();   // chiave lowercase -> {name, count}
          for (const s of this.sites) {
            for (const t of this.siteTags(s)) {
              const k = t.toLowerCase();
              if (map.has(k)) map.get(k).count++;
              else map.set(k, { name: t, count: 1 });
            }
          }
          return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
        },
        get allFilteredSelected() {
          const f = this.filtered;
          return f.length > 0 && f.every(s => this.selIds.includes(s.id));
        },

        // ---------- PAGINE PER CARTELLA (panoramica + pagina tag) ----------
        _statsOf(arr) {
          return {
            count: arr.length,
            upd: arr.filter(s => this.hasUpd(s)).length,
            updTot: arr.reduce((n, s) => n + (s.updates_count || 0), 0),
            off: arr.filter(s => s.status && s.status !== 'ok').length,
            wp: arr.filter(s => s.cms === 'wp').length,
            joomla: arr.filter(s => s.cms === 'joomla').length,
          };
        },
        // card della panoramica: una per tag + "Senza cartella" (se serve), con conteggi
        get tagStats() {
          const out = [];
          for (const t of this.allTags) {
            const tf = t.name.toLowerCase();
            const arr = this.sites.filter(s => this.siteTags(s).some(x => x.toLowerCase() === tf));
            out.push({ key: t.name, name: t.name, ...this._statsOf(arr) });
          }
          const none = this.sites.filter(s => this.siteTags(s).length === 0);
          if (none.length) out.push({ key: '__none', name: 'Senza cartella', ...this._statsOf(none) });
          return out;
        },
        get totStats() { return this._statsOf(this.sites); },
        // stats della pagina tag corrente (header)
        get pageStats() {
          if (!this.page || this.page === 'ov') return this._statsOf([]);
          const arr = this.page === '__none'
            ? this.sites.filter(s => this.siteTags(s).length === 0)
            : this.sites.filter(s => this.siteTags(s).some(t => t.toLowerCase() === this.page.toLowerCase()));
          return this._statsOf(arr);
        },
        get pageTitle() { return this.page === '__none' ? 'Senza cartella' : this.page; },
        setPage(p) {
          this.page = p;
          this.tagFilter = '';            // le pagine sostituiscono il filtro chip
          this.selMode = false; this.selIds = [];
          location.hash = p === null ? '' : (p === 'ov' ? '#ov' : '#t/' + encodeURIComponent(p));
          window.scrollTo(0, 0);
        },
        _readHash() {
          const h = location.hash || '';
          if (h === '#ov') this.page = 'ov';
          else if (h.startsWith('#t/')) this.page = decodeURIComponent(h.slice(3));
          else this.page = null;
        },

        // ---------- ARCHIVIO CONNETTORI ----------
        async openConn() {
          this.showConn = true; this.connErr = ''; this.connMsg = '';
          await this.loadConn();
          try {
            const r = await fetch('/api/connectors/regkey', { headers: this.h() });
            if (r.ok) this.regKey = (await r.json()).key || '';
          } catch (e) { /* la chiave resta vuota, il resto della modale funziona */ }
        },
        async rotateRegKey() {
          try {
            const r = await fetch('/api/connectors/regkey/rotate', { method: 'POST', headers: this.h() });
            if (r.ok) { this.regKey = (await r.json()).key || ''; this.connMsg = 'Chiave rigenerata.'; }
          } catch (e) { this.connErr = 'Errore di rete'; }
        },
        async loadConn() {
          try {
            const r = await fetch('/api/connectors', { headers: this.h() });
            if (r.ok) this.connList = await r.json();
          } catch (e) { this.connErr = 'Errore di rete'; }
        },
        async uploadConn(kind, ev) {
          const f = ev.target.files && ev.target.files[0];
          if (!f) return;
          this.connBusy = true; this.connErr = ''; this.connMsg = '';
          try {
            const fd = new FormData();
            fd.append('package', f);
            const r = await fetch('/api/connectors/' + kind, {
              method: 'POST', headers: { 'Authorization': 'Bearer ' + this.token }, body: fd,
            });
            if (r.ok) {
              this.connMsg = 'Connettore ' + (kind === 'wp' ? 'WordPress' : 'Joomla') + ' caricato.';
              await this.loadConn();
            } else {
              const d = await r.json().catch(() => ({}));
              this.connErr = d.detail || 'Upload fallito';
            }
          } catch (e) { this.connErr = 'Errore di rete'; }
          this.connBusy = false;
          ev.target.value = '';   // permette di ricaricare lo stesso file
        },
        connDownloadUrl(kind) { return '/api/connectors/' + kind + '/download?k=' + encodeURIComponent(this.imageToken); },
        connDate(m) { return m ? new Date(m * 1000).toLocaleString(I18n.locale, { dateStyle: 'short', timeStyle: 'short' }) : ''; },
        connSize(b) { return b ? (b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB') : ''; },

        // ---------- TAG / SELEZIONE ----------
        siteTags(s) { return (s.tags || '').split(',').map(t => t.trim()).filter(Boolean); },
        toggleTagFilter(name) { this.tagFilter = (this.tagFilter.toLowerCase() === name.toLowerCase()) ? '' : name; },
        toggleSelMode() { this.selMode = !this.selMode; if (!this.selMode) this.selIds = []; },
        isSel(id) { return this.selIds.includes(id); },
        toggleSel(id) { const i = this.selIds.indexOf(id); if (i >= 0) this.selIds.splice(i, 1); else this.selIds.push(id); },
        rowClick(s) { if (this.selMode) this.toggleSel(s.id); else this.detail(s); },
        selectAllFiltered() {
          const ids = this.filtered.map(s => s.id);
          if (this.allFilteredSelected) this.selIds = this.selIds.filter(id => !ids.includes(id));
          else { const set = new Set(this.selIds); ids.forEach(id => set.add(id)); this.selIds = [...set]; }
        },
        openTagModal(mode) { this.tagModal = mode; this.tagInput = ''; this.rmTags = []; this.tagErr = ''; this.tagMsg = ''; },
        toggleRmTag(name) {
          const i = this.rmTags.findIndex(t => t.toLowerCase() === name.toLowerCase());
          if (i >= 0) this.rmTags.splice(i, 1); else this.rmTags.push(name);
        },
        async applyTags() {
          this.tagErr = ''; this.tagMsg = '';
          if (!this.selIds.length) { this.tagErr = 'Nessun sito selezionato'; return; }
          const body = { site_ids: this.selIds, add: [], remove: [] };
          if (this.tagModal === 'add') {
            body.add = this.tagInput.split(',').map(t => t.trim()).filter(Boolean);
            if (!body.add.length) { this.tagErr = 'Inserisci almeno un tag'; return; }
          } else {
            body.remove = this.rmTags.slice();
            if (!body.remove.length) { this.tagErr = 'Seleziona almeno un tag da rimuovere'; return; }
          }
          this.tagBusy = true;
          try {
            const r = await fetch('/api/sites/bulk/tags', { method: 'POST', headers: this.h(), body: JSON.stringify(body) });
            if (r.status === 401) { this.logout(); return; }
            if (!r.ok) { this.tagErr = (await r.json().catch(() => ({}))).detail || ('Errore ' + r.status); return; }
            const d = await r.json();
            this.tagMsg = (this.tagModal === 'add' ? 'Tag aggiunti a ' : 'Tag rimossi da ') + d.updated + ' siti.';
            await this.load();
            // se ho rimosso il tag attivo come filtro e non esiste piu', resetto il filtro
            if (this.tagFilter && !this.allTags.some(t => t.name.toLowerCase() === this.tagFilter.toLowerCase())) this.tagFilter = '';
            setTimeout(() => { this.tagModal = null; }, 700);
          } catch (e) { this.tagErr = 'Errore di rete'; }
          this.tagBusy = false;
        },

        updTotal(s) { return (s.upd_plugins || 0) + (s.upd_themes || 0) + (s.upd_other || 0); },
        hasUpd(s) { return this.updTotal(s) > 0 || s.core_update; },
        dotClass(s) { if (!s.status) return 'unk'; return s.status === 'ok' ? 'ok' : 'err'; },
        rowClass(s) { if (s.status && s.status !== 'ok') return 'r-err'; if (this.hasUpd(s)) return 'r-upd'; if (s.status === 'ok') return 'r-ok'; return ''; },
        statusLabel(s) { if (!s.status) return 'mai controllato'; return s.status === 'ok' ? 'online' : 'offline'; },
        hostOf(u) { try { return new URL(u).host; } catch (e) { return u; } },

        async bulkAutoUpdate(val) {
          this.bulkBusy = true; this.bulkMsg = '';
          try {
            const r = await fetch('/api/sites/bulk/auto-update?enabled=' + (val ? 'true' : 'false'), { method: 'POST', headers: this.h() });
            if (r.status === 401) { this.logout(); return; }
            if (r.ok) { const d = await r.json(); this.bulkMsg = (val ? 'Auto-update attivato' : 'Auto-update disattivato') + ' su ' + d.updated + ' siti.'; await this.load(); }
            else this.bulkMsg = 'Errore durante l\'operazione.';
          } catch (e) { this.bulkMsg = 'Errore di rete.'; }
          this.bulkBusy = false;
        },

        async testTelegram() {
          this.tgBusy = true; this.tgMsg = ''; this.tgErr = '';
          try {
            const r = await fetch('/api/sites/telegram/test', { method: 'POST', headers: this.h() });
            if (r.status === 401) { this.logout(); return; }
            if (r.ok) { this.tgMsg = 'Messaggio inviato! Controlla Telegram.'; }
            else { this.tgErr = (await r.json()).detail || 'Invio fallito.'; }
          } catch (e) { this.tgErr = 'Errore di rete.'; }
          this.tgBusy = false;
        },

        // ---------- MASS INSTALL ----------
        instSites() { return this.sites.filter(s => s.cms === this.inst.cms); },
        instAllSelected() { const a = this.instSites(); return a.length > 0 && a.every(s => this.inst.sel.includes(s.id)); },
        instSelectAll() { const a = this.instSites(); this.inst.sel = this.instAllSelected() ? [] : a.map(s => s.id); },
        openInstall() { this.showInstall = true; this.instErr = ''; this.instResults = []; this.instFile = null; this.inst.sel = []; this.inst.mode = 'install'; this.inst.rmItems = []; this.inst.q = ''; this.inst.searchResults = []; this.inst.searched = false; this.inst.openKeys = []; },
        instSearchReset() { this.inst.searchResults = []; this.inst.searched = false; this.inst.searchErr = ''; this.inst.rmItems = []; this.inst.sel = []; },
        async instSearch() {
          this.inst.searchErr = ''; this.inst.searched = false; this.inst.searchResults = [];
          const q = this.inst.q.trim();
          if (q.length < 2) { this.inst.searchErr = 'Inserisci almeno 2 caratteri'; return; }
          this.inst.searchBusy = true;
          try {
            const r = await fetch('/api/install/search?cms=' + this.inst.cms + '&q=' + encodeURIComponent(q), { headers: this.h() });
            if (r.status === 401) { this.logout(); return; }
            if (!r.ok) { this.inst.searchErr = (await r.json().catch(() => ({}))).detail || ('Errore ' + r.status); return; }
            const d = await r.json();
            this.inst.searchResults = d.results || []; this.inst.searched = true;
          } catch (e) { this.inst.searchErr = 'Errore di rete'; }
          this.inst.searchBusy = false;
        },
        instResultSelected(r) { return this.inst.rmItems.some(i => i.type === r.type && i.slug === r.slug); },
        // elenco siti espandibile nei risultati di ricerca (chiavi aperte: type|slug)
        instIsOpen(r) { return (this.inst.openKeys || []).includes(r.type + '|' + r.slug); },
        instToggleOpen(r) {
          const k = r.type + '|' + r.slug;
          const arr = this.inst.openKeys || [];
          this.inst.openKeys = arr.includes(k) ? arr.filter(x => x !== k) : [...arr, k];
        },
        instToggleResult(r) {
          if (r.protected) return;
          const i = this.inst.rmItems.findIndex(x => x.type === r.type && x.slug === r.slug);
          if (i >= 0) this.inst.rmItems.splice(i, 1);
          else this.inst.rmItems.push({ type: r.type, slug: r.slug, name: r.name, site_ids: r.site_ids || [] });
          // siti = unione dei site_ids degli item selezionati, limitata ai siti del cms corrente
          const valid = new Set(this.instSites().map(s => s.id));
          const union = new Set();
          this.inst.rmItems.forEach(it => (it.site_ids || []).forEach(id => { if (valid.has(id)) union.add(id); }));
          this.inst.sel = [...union];
        },
        closeInstall() { if (this.instBusy) return; this.showInstall = false; },
        async runInstall() {
          this.instErr = ''; this.instResults = [];
          if (!this.instFile) { this.instErr = 'Seleziona un file .zip'; return; }
          if (!this.instFile.name.toLowerCase().endsWith('.zip')) { this.instErr = 'Il pacchetto deve essere un .zip'; return; }
          if (!this.inst.sel.length) { this.instErr = 'Seleziona almeno un sito'; return; }
          const fd = new FormData();
          fd.append('package', this.instFile);
          fd.append('cms', this.inst.cms);
          fd.append('kind', this.inst.kind);
          fd.append('activate', this.inst.activate ? 'true' : 'false');
          fd.append('site_ids', this.inst.sel.join(','));
          this.instBusy = true;
          try {
            // NB: niente Content-Type a mano: lo setta il browser col boundary del multipart
            const r = await fetch('/api/install', { method: 'POST', headers: { 'Authorization': 'Bearer ' + this.token }, body: fd });
            if (r.status === 401) { this.logout(); return; }
            if (!r.ok) { this.instErr = (await r.json().catch(() => ({}))).detail || ('Errore ' + r.status); return; }
            const d = await r.json();
            this.instResults = d.results || [];
            this.instSummary = { ok: d.ok || 0, failed: d.failed || 0, total: d.total || 0 };
            await this.load();   // ricarica i contatori (un nuovo plugin attivo cambia gli stati)
          } catch (e) { this.instErr = 'Errore di rete: ' + e; }
          this.instBusy = false;
        },
        async runUninstall() {
          this.instErr = ''; this.instResults = [];
          if (!this.inst.rmItems.length) { this.instErr = 'Seleziona almeno un\'estensione'; return; }
          if (!this.inst.sel.length) { this.instErr = 'Seleziona almeno un sito'; return; }
          const items = this.inst.rmItems.map(i => ({ type: i.type, slug: i.slug }));
          const n = this.inst.sel.length, m = items.length;
          if (!confirm('RIMOZIONE: ' + m + ' estensione/i (' + items.map(i => i.slug).join(', ') + ') verranno disinstallate da ' + n + ' sito/i. Operazione irreversibile. Procedo?')) return;
          this.instBusy = true;
          try {
            const r = await fetch('/api/install/remove', {
              method: 'POST', headers: this.h(),
              body: JSON.stringify({ cms: this.inst.cms, items: items, site_ids: this.inst.sel })
            });
            if (r.status === 401) { this.logout(); return; }
            if (!r.ok) { this.instErr = (await r.json().catch(() => ({}))).detail || ('Errore ' + r.status); return; }
            const d = await r.json();
            this.instResults = d.results || [];
            this.instSummary = { ok: d.ok || 0, failed: d.failed || 0, total: d.total || 0 };
            await this.load();
          } catch (e) { this.instErr = 'Errore di rete: ' + e; }
          this.instBusy = false;
        },

        async addSite() {
          this.formErr = '';
          const r = await fetch('/api/sites', { method: 'POST', headers: this.h(), body: JSON.stringify(this.form) });
          if (!r.ok) { this.formErr = (await r.json()).detail || 'Errore'; return; }
          this.showAdd = false; this.form = { name: '', url: '', cms: 'wp', admin_url: '', token: '', group: '', tags: '', poll_interval_minutes: 180, auto_update: false };
          await this.load();
        },
        async refresh(s) { const r = await fetch(`/api/sites/${s.id}/refresh`, { method: 'POST', headers: this.h() }); if (r.ok) Object.assign(s, await r.json()); },
        async massUpdate() {
          // conta quanti hanno update pending per la conferma
          const pending = this.sites.filter(s => s.auto_update && (s.core_update || (s.upd_plugins||0)>0 || (s.upd_themes||0)>0 || (s.upd_other||0)>0));
          if (pending.length === 0) {
            alert('Nessun sito con aggiornamenti in sospeso.');
            return;
          }
          if (!confirm(`Aggiorno subito ${pending.length} sit${pending.length===1?'o':'i'} con update in sospeso?\n\nRiceverai il riepilogo su Telegram a fine ciclo.`)) return;
          this.massBusy = true;
          try {
            const r = await fetch('/api/sites/bulk/update-now', { method:'POST', headers:this.h() });
            if (r.status === 401) { this.logout(); return; }
            if (r.ok) {
              const d = await r.json();
              alert(`Avviato l'aggiornamento di ${d.queued} sit${d.queued===1?'o':'i'}. Gli update partono a breve, il riepilogo arriva su Telegram.`);
              // ricarica a raffica mentre gli update scaglionati completano, cosi' gli item
              // aggiornati spariscono senza aspettare il tick da 60s.
              [20000, 60000, 120000, 180000].forEach(ms => setTimeout(() => { if (this.token) this.load(); }, ms));
            } else {
              alert('Errore nell\'avvio del mass update.');
            }
          } catch(e) { alert('Errore di rete.'); }
          this.massBusy = false;
        },
        async massUpdateSelected() {
          if (!this.selIds.length) return;
          if (!confirm(`Aggiorno subito ${this.selIds.length} sit${this.selIds.length===1?'o':'i'} selezionat${this.selIds.length===1?'o':'i'}?\n\nRiceverai il riepilogo su Telegram a fine ciclo.`)) return;
          this.massBusy = true;
          try {
            const r = await fetch('/api/sites/bulk/update-selected', {
              method:'POST', headers:this.h(),
              body: JSON.stringify({ ids: this.selIds })
            });
            if (r.status === 401) { this.logout(); return; }
            if (r.ok) {
              const d = await r.json();
              alert(`Avviato l'aggiornamento di ${d.queued} sit${d.queued===1?'o':'i'}. Il riepilogo arriva su Telegram.`);
              // ricarica a raffica mentre gli update scaglionati completano.
              [20000, 60000, 120000, 180000].forEach(ms => setTimeout(() => { if (this.token) this.load(); }, ms));
            } else {
              alert('Errore nell\'avvio dell\'aggiornamento selezionati.');
            }
          } catch(e) { alert('Errore di rete.'); }
          this.massBusy = false;
        },
        async refreshAll() { for (const s of this.sites) { await this.refresh(s); } },
        async shoot(s) { const r = await fetch(`/api/sites/${s.id}/screenshot`, { method: 'POST', headers: this.h() }); if (r.ok) Object.assign(s, await r.json()); },
        async detail(s) {
          const r = await fetch(`/api/sites/${s.id}`, { headers: this.h() });
          if (r.ok) { this.sel = await r.json(); this.openGrps = this.groups(this.sel.extensions).filter(g => g.updcount > 0).map(g => g.title); }
        },
        openEdit(s) {
          this.editErr = '';
          this.edit = { id: s.id, name: s.name, url: s.url, cms: s.cms, admin_url: s.admin_url || '', token: s.token || '', group: s.group || '', tags: s.tags || '', poll_interval_minutes: s.poll_interval_minutes, auto_update: !!s.auto_update };
          this.sel = null;
        },
        async saveEdit() {
          this.editErr = '';
          const { id, ...body } = this.edit;
          const r = await fetch(`/api/sites/${id}`, { method: 'PATCH', headers: this.h(), body: JSON.stringify(body) });
          if (!r.ok) { this.editErr = (await r.json()).detail || 'Errore'; return; }
          const updated = await r.json(); this.edit = null;
          if (this.sel && this.sel.id === id) Object.assign(this.sel, updated);
          await this.load();
        },
        async del(s) { if (!confirm('Eliminare ' + s.name + '?')) return; await fetch(`/api/sites/${s.id}`, { method: 'DELETE', headers: this.h() }); this.sel = null; await this.load(); },
        openSite(s) { window.open(s.url, '_blank'); },
        async goAdmin(s) {
          const w = window.open('', '_blank'); const al = s.cms === 'wp';
          try {
            const r = await fetch(`/api/sites/${s.id}/admin?autologin=${al}`, { headers: this.h() });
            if (r.ok) { const u = (await r.json()).url; if (u && w) { w.location.href = u; return; } if (u) { window.open(u, '_blank'); return; } }
            if (w) w.close(); alert('Impossibile aprire l\'admin: URL non disponibile.');
          } catch (e) { if (w) w.close(); alert('Errore apertura admin: ' + e); }
        },
        copy(t) {
          if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t).then(() => { }, () => { }); return; }
          const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.focus(); ta.select(); try { document.execCommand('copy'); } catch (e) { } document.body.removeChild(ta);
        },
        groups(exts) {
          const e = exts || []; const cat = t => (t === 'plugin' ? 'plugin' : ((t === 'theme' || t === 'template') ? 'theme' : 'other'));
          const b = { plugin: [], theme: [], other: [] }; for (const x of e) { b[cat(x.type)].push(x); }
          const sortf = (a, b) => (b.update_available - a.update_available) || a.name.localeCompare(b.name);
          const mk = (title, items) => ({ title, items: items.sort(sortf), updcount: items.filter(x => x.update_available).length });
          const out = [];
          if (b.plugin.length) out.push(mk('Plugin', b.plugin));
          if (b.theme.length) out.push(mk('Temi / Template', b.theme));
          if (b.other.length) out.push(mk('Componenti / Moduli / Librerie', b.other));
          return out;
        },
        toggleGrp(t) { const i = this.openGrps.indexOf(t); if (i >= 0) this.openGrps.splice(i, 1); else this.openGrps.push(t); },

        // ---------- SICUREZZA / 2FA ----------
        async loadSec() {
          const r = await fetch('/api/2fa/status', { headers: this.h() });
          if (r.ok) this.sec = await r.json();
        },
        async startTotpSetup() {
          this.secErr = '';
          const r = await fetch('/api/2fa/totp/setup', { headers: this.h() });
          if (!r.ok) { this.secErr = (await r.json()).detail || 'Errore setup'; return; }
          this.totpSetup = await r.json();
        },
        async enableTotp() {
          this.secErr = '';
          const r = await fetch('/api/2fa/totp/enable', { method: 'POST', headers: this.h(), body: JSON.stringify({ code: this.totpEnableCode }) });
          if (!r.ok) { this.secErr = (await r.json()).detail || 'Codice non valido'; return; }
          this.totpSetup = null; this.totpEnableCode = ''; this.needs2faSetup = false; await this.loadSec();
        },
        async disableTotp() {
          if (!confirm('Disattivare il TOTP?')) return;
          await fetch('/api/2fa/totp/disable', { method: 'POST', headers: this.h() }); await this.loadSec();
        },
        async registerPasskey() {
          this.secErr = '';
          try {
            const r = await fetch('/api/webauthn/register/begin', { method: 'POST', headers: this.h() });
            if (!r.ok) { this.secErr = (await r.json()).detail || 'Errore'; return; }
            const opts = await r.json();
            opts.challenge = b64uToBuf(opts.challenge);
            opts.user.id = b64uToBuf(opts.user.id);
            if (opts.excludeCredentials) opts.excludeCredentials = opts.excludeCredentials.map(c => ({ ...c, id: b64uToBuf(c.id) }));
            const cred = await navigator.credentials.create({ publicKey: opts });
            const payload = {
              id: cred.id, rawId: bufToB64u(cred.rawId), type: cred.type,
              response: {
                attestationObject: bufToB64u(cred.response.attestationObject),
                clientDataJSON: bufToB64u(cred.response.clientDataJSON),
              },
            };
            const label = prompt('Nome per questa passkey (es. iPhone, MacBook):', 'passkey') || 'passkey';
            const r2 = await fetch('/api/webauthn/register/complete', { method: 'POST', headers: this.h(), body: JSON.stringify({ credential: payload, label }) });
            if (!r2.ok) { this.secErr = (await r2.json()).detail || 'Registrazione fallita'; return; }
            this.needs2faSetup = false; await this.loadSec();
          } catch (e) { this.secErr = 'Registrazione annullata o non disponibile'; }
        },
        async deletePasskey(id) {
          if (!confirm('Rimuovere questa passkey?')) return;
          await fetch('/api/webauthn/register/delete', { method: 'POST', headers: this.h(), body: JSON.stringify({ label: id }) });
          await this.loadSec();
        },
        async changeUser() {
          this.userMsg = ''; this.userErr = '';
          const r = await fetch('/api/account/username', { method: 'POST', headers: this.h(), body: JSON.stringify({ username: this.sec.username }) });
          if (!r.ok) { this.userErr = (await r.json()).detail || 'Errore'; return; }
          this.userMsg = 'Nome utente aggiornato.';
        },
        async changePw() {
          this.pwErr = ''; this.pwMsg = '';
          const r = await fetch('/api/account/password', { method: 'POST', headers: this.h(), body: JSON.stringify({ old_password: this.pwOld, new_password: this.pwNew }) });
          if (!r.ok) { this.pwErr = (await r.json()).detail || 'Errore'; return; }
          this.pwMsg = 'Password aggiornata.'; this.pwOld = ''; this.pwNew = '';
        },
      }
    }
    // carica lo stato sicurezza quando apri il modale
    document.addEventListener('alpine:init', () => { });
  </script>
