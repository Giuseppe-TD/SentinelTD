<!DOCTYPE html>
<html lang="it" data-project="panopticon-lite">

<head>
  <meta charset="utf-8">
  <script src="/static/i18n/catalog.js"></script>
  <script src="/static/i18n/i18n.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panopticon · Tastiere Digitali</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/favicon.png">
  <script defer src="/static/vendor/alpine.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --card2: #161922;
      --bd: #2a2f3a;
      --txt: #e6e8ec;
      --mut: #8b93a1;
      --ok: #3ecf8e;
      --warn: #f5a623;
      --err: #ff5c5c;
      --acc: #5b8cff
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font: 14px/1.45 system-ui, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--txt)
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 20px;
      border-bottom: 1px solid var(--bd);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 5
    }

    header .logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--txt);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg);
      font-weight: 700
    }

    .hdr-logo {
      height: 32px;
      width: auto;
      max-width: 140px;
      object-fit: contain;
      display: block
    }

    header h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
      line-height: 1
    }

    header .sub {
      font-size: 11px;
      color: var(--mut)
    }

    .sp {
      flex: 1
    }

    button {
      cursor: pointer;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--txt);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      transition: border-color .12s
    }

    button:hover {
      border-color: var(--acc)
    }

    button.primary {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff
    }

    button.on {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff
    }

    button.danger {
      color: var(--err);
      border-color: #3a2630
    }

    button.ghost {
      background: transparent
    }

    input,
    select {
      background: var(--card);
      border: 1px solid var(--bd);
      color: var(--txt);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      width: 100%
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--acc)
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--bd);
      border-radius: 8px;
      overflow: hidden
    }

    .seg button {
      border: none;
      border-radius: 0;
      padding: 7px 10px
    }

    .seg button.on {
      background: var(--acc);
      color: #fff
    }

    /* ---- toolbar ---- */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      flex-wrap: wrap
    }

    .search {
      position: relative;
      flex: 0 0 auto
    }

    .search input {
      width: 210px;
      padding-left: 30px
    }

    .search svg {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .5
    }

    /* ---- metric cards ---- */
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 0 20px 6px
    }

    .metric {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 10px 14px
    }

    .metric .l {
      font-size: 12px;
      color: var(--mut)
    }

    .metric .n {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.2
    }

    /* ---- list view ---- */
    .listwrap {
      margin: 10px 20px 30px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 12px;
      overflow: hidden
    }

    .lhead,
    .lrow {
      display: grid;
      grid-template-columns: 16px 2.2fr 78px 110px 1.3fr 86px;
      gap: 12px;
      align-items: center;
      padding: 11px 16px
    }

    .lhead {
      border-bottom: 1px solid var(--bd);
      font-size: 12px;
      color: var(--mut)
    }

    .lrow {
      border-bottom: 1px solid var(--bd);
      cursor: pointer;
      position: relative
    }

    .lrow:last-child {
      border-bottom: none
    }

    .lrow:hover {
      background: var(--card2)
    }

    /* sfondo riga + bordo sinistro colorato per stato */
    .lrow.r-upd {
      background: rgba(245, 166, 35, .06);
      box-shadow: inset 3px 0 0 var(--warn)
    }

    .lrow.r-upd:hover {
      background: rgba(245, 166, 35, .11)
    }

    .lrow.r-err {
      background: rgba(224, 76, 76, .07);
      box-shadow: inset 3px 0 0 var(--err)
    }

    .lrow.r-err:hover {
      background: rgba(224, 76, 76, .12)
    }

    .lrow.r-ok {
      box-shadow: inset 3px 0 0 var(--ok)
    }

    .lname {
      font-weight: 600;
      font-size: 14px
    }

    .lurl {
      font-size: 12px;
      color: var(--mut)
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      display: inline-block;
      flex: 0 0 auto;
      border: 2px solid transparent
    }

    .ok {
      background: var(--ok);
      box-shadow: 0 0 0 3px rgba(60, 200, 120, .18)
    }

    .err {
      background: var(--err);
      box-shadow: 0 0 0 3px rgba(224, 76, 76, .20)
    }

    .unk {
      background: var(--mut)
    }

    /* badge stato testuale */
    .sbadge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px
    }

    .sbadge::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor
    }

    .sb-ok {
      background: rgba(60, 200, 120, .14);
      color: var(--ok)
    }

    .sb-err {
      background: rgba(224, 76, 76, .16);
      color: var(--err)
    }

    .sb-upd {
      background: rgba(245, 166, 35, .16);
      color: var(--warn)
    }

    .sb-unk {
      background: var(--card2);
      color: var(--mut)
    }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--bd);
      white-space: nowrap
    }

    .b-wp {
      color: #4aa3df;
      border-color: #27566f
    }

    .b-joomla {
      color: #f5a623;
      border-color: #5e4a1e
    }

    .pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap
    }

    .pill.w {
      background: #3a2f17;
      color: var(--warn)
    }

    .pill.k {
      background: #3a2226;
      color: var(--err)
    }

    .pill.g {
      background: #16291f;
      color: var(--ok)
    }

    .vup {
      color: var(--warn);
      font-weight: 600
    }

    .vok {
      color: var(--ok)
    }

    .lact {
      display: flex;
      gap: 5px;
      justify-content: flex-end
    }

    .lact button {
      padding: 5px 8px;
      line-height: 1
    }

    .mut {
      color: var(--mut);
      font-size: 12px
    }

    /* filtri */
    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center
    }

    .filters button {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      background: var(--card);
      border: 1px solid var(--bd);
      color: var(--mut);
      cursor: pointer
    }

    .filters button.on {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff
    }

    .filters .fcount {
      font-size: 11px;
      opacity: .7;
      margin-left: 3px
    }

    /* ---- tag / cartelle ---- */
    .tagbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      padding: 0 20px 6px
    }

    .tagbar .lbl {
      font-size: 11px;
      color: var(--mut);
      margin-right: 2px
    }

    .tchip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      background: var(--card);
      border: 1px solid var(--bd);
      color: var(--txt);
      cursor: pointer
    }

    .tchip .c {
      font-size: 11px;
      opacity: .6
    }

    .tchip.on {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff
    }

    .tchip.on .c {
      opacity: .85
    }

    /* tag piccoli mostrati sotto il nome del sito */
    .tags-mini {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 3px
    }

    .tmini {
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 10px;
      background: var(--card2);
      border: 1px solid var(--bd);
      color: var(--mut);
      cursor: pointer;
      line-height: 1.5
    }

    .tmini:hover {
      color: var(--acc);
      border-color: var(--acc)
    }

    /* barra azioni selezione multipla */
    .selbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 20px 8px;
      padding: 9px 14px;
      background: rgba(91, 140, 255, .1);
      border: 1px solid var(--acc);
      border-radius: 10px
    }

    .selbar .cnt {
      font-weight: 600
    }

    .selbar .sp {
      flex: 1
    }

    /* checkbox riga lista al posto del dot */
    .selck {
      width: 16px;
      height: 16px;
      accent-color: var(--acc);
      cursor: pointer
    }

    /* checkbox overlay sulla card */
    .card .selovl {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 3;
      width: 20px;
      height: 20px;
      accent-color: var(--acc);
      cursor: pointer
    }

    .card.selon {
      cursor: pointer
    }

    .card.selpick {
      outline: 2px solid var(--acc);
      outline-offset: -2px
    }

    /* datalist input dei tag nei form */
    .taginput {
      width: 100%
    }

    /* ---- card view ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
      padding: 10px 20px 30px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative
    }

    .shot {
      aspect-ratio: 16/9;
      background: #000 center/cover no-repeat;
      cursor: pointer;
      position: relative;
      border-bottom: 1px solid var(--bd)
    }

    .shot .ph {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mut);
      font-size: 12px
    }

    .cbody {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .counts {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 12px
    }

    .chip {
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 2px 7px
    }

    .chip.w {
      border-color: var(--warn);
      color: var(--warn)
    }

    .actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap
    }

    .actions button {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px
    }

    /* ---- modal ---- */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10
    }

    .modal .panel {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 22px;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow: auto
    }

    .panel h2 {
      margin: 0;
      font-size: 17px
    }

    label {
      font-size: 12px;
      color: var(--mut);
      display: block;
      margin-bottom: 4px
    }

    .tok {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      background: #0d0f13;
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 8px;
      word-break: break-all
    }

    .grp {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--mut);
      margin-top: 10px;
      border-top: 1px solid var(--bd);
      padding-top: 8px
    }

    .grp-acc {
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none
    }

    .grp-acc:hover {
      color: var(--txt)
    }

    .grp-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      text-transform: none;
      letter-spacing: 0
    }

    .extrow {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 3px 0;
      font-size: 12px
    }

    .extrow .v {
      font-family: ui-monospace, Menlo, Consolas, monospace
    }

    /* ---- login ---- */
    .login {
      max-width: 360px;
      margin: 13vh auto;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .login .box {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .login .logo {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      background: var(--txt);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg);
      font-weight: 700;
      font-size: 22px;
      margin: 0 auto
    }

    .login-logo {
      max-width: 170px;
      max-height: 80px;
      width: auto;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
      display: block
    }

    .login h2 {
      margin: 0;
      text-align: center;
      font-size: 18px
    }

    .login .hint {
      font-size: 12px;
      color: var(--mut);
      text-align: center
    }

    .err-msg {
      color: var(--err);
      font-size: 13px;
      text-align: center
    }

    .ok-msg {
      color: var(--ok);
      font-size: 13px;
      text-align: center
    }

    .qr {
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      width: 200px;
      margin: 0 auto
    }

    .qr svg {
      width: 100%;
      height: auto;
      display: block
    }

    .method-btns {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--mut);
      font-size: 12px
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--bd)
    }

    .codeinput {
      font-size: 22px;
      letter-spacing: .3em;
      text-align: center;
      font-family: ui-monospace, monospace
    }

    /* ============================================================
       RESPONSIVE MOBILE (<= 640px)
       ============================================================ */
    @media (max-width: 640px) {
      /* --- HEADER: logo piu' piccolo, testo compatto, pulsanti a scorrimento --- */
      header {
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 12px;
        row-gap: 8px;
      }
      .hdr-logo { height: 26px; max-width: 110px; }
      header h1 { font-size: 14px; }
      header .sub { font-size: 11px; }
      /* i pulsanti header vanno su una riga propria, scrollabile in orizzontale */
      header .sp { display: none; }
      .hdr-btn {
        font-size: 12px !important;
        padding: 7px 10px !important;
        white-space: nowrap;
      }
      /* wrapper implicito: i bottoni finiscono a capo e riempiono la larghezza */
      header > .hdr-btn { flex: 0 0 auto; }

      /* --- TOOLBAR: ricerca a tutta larghezza, controlli sotto --- */
      .toolbar {
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 12px;
      }
      .toolbar .search { flex: 1 1 100%; }
      .toolbar .search input { width: 100%; }

      /* --- METRICHE: 2 colonne invece di 4 --- */
      .metrics {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 8px;
        padding: 0 12px;
      }
      .metric { padding: 12px !important; }
      .metric .n { font-size: 22px !important; }

      /* --- FILTRI: scroll orizzontale invece di andare a capo caotico --- */
      .filters, .tagbar {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
        scrollbar-width: none;
      }
      .filters::-webkit-scrollbar, .tagbar::-webkit-scrollbar { display: none; }
      .filters > button, .tagbar > .tchip { flex: 0 0 auto; }
      /* segmento Lista/Card e pulsanti toolbar: non stringere troppo */
      .seg { flex: 0 0 auto; }

      /* --- LISTA: da griglia rigida a blocco leggibile su mobile --- */
      .lhead { display: none; }
      .lrow {
        display: flex !important;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
        padding: 12px 14px;
      }
      /* dot/checkbox: dimensione fissa */
      .lrow > :nth-child(1) { flex: 0 0 auto; }
      /* blocco nome: prende lo spazio, spinge le azioni a destra */
      .lrow > :nth-child(2) { flex: 1 1 auto; min-width: 0; }
      .lrow .lname { white-space: normal; }
      /* azioni (⟳ ↗): restano in alto a destra sulla prima riga */
      .lrow > .lact { flex: 0 0 auto; order: 3; }
      /* cms + core + update badge: vanno a capo tutti insieme sulla riga sotto */
      .lrow > :nth-child(3),
      .lrow > :nth-child(4),
      .lrow > :nth-child(5) {
        order: 4;
        flex: 0 0 auto;
      }
      /* forza l'a-capo prima dei badge meta: uno spacer invisibile a larghezza piena */
      .lrow > :nth-child(3)::before {
        content: "";
        display: block;
        width: 100vw;
        height: 0;
      }

      /* container centrale: meno padding laterale su mobile */
      .listwrap { margin: 10px 10px 20px; }

      /* modali: quasi fullscreen su mobile */
      .panel {
        max-width: 94vw !important;
        margin: 4vh auto !important;
        padding: 18px !important;
      }
    }

    /* schermi molto stretti (<=380px): metriche a 2 col ma piu' strette */
    @media (max-width: 380px) {
      .hdr-btn { font-size: 11px !important; padding: 6px 8px !important; }
      .metric .n { font-size: 20px !important; }
    }
    /* ===== pagine cartella / panoramica ===== */
    .pagehead { display:flex; align-items:center; gap:14px; padding:12px 20px 0; flex-wrap:wrap; }
    .pagehead h2 { margin:0; font-size:20px; }
    .pagehead .phs { font-size:13px; color:var(--txt); background:var(--panel); border:1px solid var(--bd);
      border-radius:8px; padding:4px 10px; }
    .pagehead .phs.warn { color:var(--warn); border-color:#5e4a1e; }
    .pagehead .phs.err { color:var(--err); border-color:#5e2a2a; }
    .pagehead .phs.mut, .pagehead .phs .mut { color:var(--mut); }
    .ovwrap { padding:16px 20px 30px; }
    .ovtot { display:flex; gap:18px; align-items:baseline; flex-wrap:wrap; padding:14px 18px; margin-bottom:16px;
      background:var(--panel); border:1px solid var(--bd); border-radius:12px; }
    .ovtot .t { font-size:18px; }
    .ovtot .s { font-size:13px; }
    .ovtot .warn { color:var(--warn); } .ovtot .err { color:var(--err); } .ovtot .ok { color:var(--ok); } .ovtot .mut { color:var(--mut); }
    .ovgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
    .ovcard { background:var(--panel); border:1px solid var(--bd); border-radius:12px; padding:14px 16px;
      cursor:pointer; transition:border-color .15s, transform .05s; border-left:3px solid var(--bd); }
    .ovcard:hover { border-color:var(--acc); }
    .ovcard:active { transform:scale(.99); }
    .ovcard.has-upd { border-left-color:var(--warn); }
    .ovcard.has-off { border-left-color:var(--err); }
    .ovcard .nm { font-weight:600; font-size:15px; margin-bottom:6px; }
    .ovcard .cnt { font-size:13px; margin-bottom:4px; }
    .ovcard .row { font-size:12.5px; }
    .ovcard .warn { color:var(--warn); } .ovcard .err { color:var(--err); } .ovcard .ok { color:var(--ok); } .ovcard .mut { color:var(--mut); }
    /* ===== modale connettori ===== */
    .connrow { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--bd); }
    .connrow:last-of-type { border-bottom:none; }
    .connrow .ic { width:38px; height:38px; border-radius:9px; background:var(--bg); border:1px solid var(--bd);
      display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--acc); }
    .connrow .inf { flex:1; min-width:0; }
    .connrow .nm { font-weight:600; font-size:14px; }
    .connrow .mut { font-size:12.5px; color:var(--mut); }
    .btn-like { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:8px;
      border:1px solid var(--bd); background:var(--panel); color:var(--txt); font-size:13px; cursor:pointer;
      text-decoration:none; white-space:nowrap; }
    .btn-like:hover { border-color:var(--acc); }
    .btn-like.dis { opacity:.5; pointer-events:none; }
  </style>

  <link rel="stylesheet" href="/static/i18n/i18n.css">
</head>

<body x-data="app()" x-init="init()">

  <!-- suggerimenti tag globali (usati da modale tag, edit e add) -->
  <datalist id="tagsuggest">
    <template x-for="t in allTags" :key="t.name">
      <option :value="t.name"></option>
    </template>
  </datalist>

  <!-- ============ LOGIN ============ -->
  <template x-if="!token">
    <div class="login">
      <div class="box">
        <img src="/static/logo.png" alt="Tastiere Digitali" class="login-logo">
        <h2>Panopticon</h2>
        <div class="hint mut" style="text-align:center;margin-top:-8px">Tastiere Digitali</div>

        <!-- step password -->
        <template x-if="step==='pwd'">
          <div style="display:flex;flex-direction:column;gap:12px">
            <div class="hint">Accedi al pannello</div>
            <div>
              <label>Nome utente</label>
              <input type="text" x-model="user" @keydown.enter="login()" autocomplete="username" autofocus>
            </div>
            <div>
              <label>Password</label>
              <input type="password" x-model="pwd" @keydown.enter="login()" autocomplete="current-password">
            </div>
            <button class="primary" @click="login()">Entra</button>
          </div>
        </template>

        <!-- step 2fa -->
        <template x-if="step==='2fa'">
          <div style="display:flex;flex-direction:column;gap:14px">
            <div class="hint">Verifica in due passaggi</div>

            <template x-if="methods.includes('passkey')">
              <button class="primary" @click="loginPasskey()">
                Usa passkey / biometria
              </button>
            </template>

            <template x-if="methods.includes('passkey') && methods.includes('totp')">
              <div class="divider">oppure</div>
            </template>

            <template x-if="methods.includes('totp')">
              <div style="display:flex;flex-direction:column;gap:10px">
                <div>
                  <label>Codice dall'app Authenticator</label>
                  <input class="codeinput" inputmode="numeric" maxlength="6" x-model="code"
                    @keydown.enter="verifyTotp()" placeholder="000000">
                </div>
                <button class="primary" @click="verifyTotp()">Verifica</button>
              </div>
            </template>
          </div>
        </template>

        <div class="err-msg" x-show="err" x-text="err"></div>
      </div>
    </div>
  </template>

  <!-- ============ APP ============ -->
  <template x-if="token">
    <div>
      <header>
        <img src="/static/logo.png" alt="" class="hdr-logo">
        <div>
          <h1>Panopticon</h1>
          <div class="sub"><span style="color:var(--mut)">Tastiere Digitali</span> · <span
              x-text="sites.length+' siti monitorati'"></span></div>
        </div>
        <div class="sp"></div>
        <button class="ghost hdr-btn" @click="massUpdate()" :disabled="massBusy" title="Aggiorna subito i siti con update pending">
          <span x-show="!massBusy">⬆ Aggiorna tutto</span>
          <span x-show="massBusy">Avvio…</span>
        </button>
        <button class="ghost hdr-btn" @click="refreshAll()" title="Controlla tutti">Check tutti</button>
        <button class="ghost hdr-btn" @click="openInstall()" title="Installa plugin/tema sui siti">Installa</button>
        <button class="ghost hdr-btn" @click="openConn()" title="Scarica o aggiorna i connettori Joomla e WordPress">Connettori</button>
        <button class="ghost hdr-btn" @click="location.href='/security'" title="Centro Sicurezza — vulnerabilità note sui tuoi siti"
                :style="secBell ? 'border-color:var(--err);color:var(--err)' : ''">
          <span x-show="secBell">🔔</span><span x-show="!secBell">🛡️</span> Sicurezza
        </button>
        <button class="ghost hdr-btn" @click="show2fa=true" title="2FA e accesso">2FA</button>
        <button class="ghost hdr-btn" @click="logout()">Esci</button>
      </header>

      <!-- banner setup 2fa -->
      <template x-if="needs2faSetup">
        <div
          style="margin:14px 20px 0;padding:12px 16px;background:#3a2f17;border:1px solid #5e4a1e;border-radius:10px;display:flex;align-items:center;gap:12px">
          <span style="color:var(--warn);font-weight:600">Il 2FA non è attivo.</span>
          <span class="mut">Proteggi l'accesso con Authenticator o una passkey.</span>
          <div class="sp"></div>
          <button class="primary" @click="show2fa=true">Configura ora</button>
        </div>
      </template>

      <!-- barra viste: panoramica cartelle / tutti i siti / pagina cartella corrente -->
      <div class="toolbar" style="padding-bottom:0">
        <div class="seg">
          <button :class="page==='ov'?'on':''" @click="setPage('ov')">🗂 Panoramica</button>
          <button :class="page===null?'on':''" @click="setPage(null)">Tutti i siti</button>
          <template x-if="page && page!=='ov'">
            <button class="on" x-text="'📁 '+pageTitle"></button>
          </template>
        </div>
      </div>

      <!-- header pagina cartella -->
      <template x-if="page && page!=='ov'">
        <div class="pagehead">
          <button class="ghost" @click="setPage('ov')">← Cartelle</button>
          <h2 x-text="pageTitle"></h2>
          <span class="phs"><b x-text="pageStats.count"></b> siti</span>
          <span class="phs warn" x-show="pageStats.upd"><b x-text="pageStats.upd"></b> con update (<span x-text="pageStats.updTot"></span> tot)</span>
          <span class="phs err" x-show="pageStats.off"><b x-text="pageStats.off"></b> offline</span>
          <span class="phs mut"><span x-text="pageStats.wp"></span> WP · <span x-text="pageStats.joomla"></span> Joomla</span>
        </div>
      </template>

      <div class="toolbar" x-show="page!=='ov'">
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input placeholder="Cerca sito…" x-model="q">
        </div>
        <div class="seg">
          <button :class="view==='list'?'on':''" @click="setView('list')" title="Lista">Lista</button>
          <button :class="view==='cards'?'on':''" @click="setView('cards')" title="Card">Card</button>
        </div>
        <div class="sp"></div>
        <button @click="toggleSelMode()" :class="selMode?'primary':''" x-text="selMode?'✕ Esci selezione':'☑ Seleziona'"></button>
        <button class="primary" @click="showAdd=true">+ Nuovo sito</button>
      </div>

      <!-- filtri rapidi -->
      <div class="toolbar" style="padding-top:0" x-show="page!=='ov'">
        <div class="filters">
          <button :class="flt==='all'?'on':''" @click="flt='all'">Tutti<span class="fcount"
              x-text="page&&page!=='ov'?pageStats.count:sites.length"></span></button>
          <button :class="flt==='upd'?'on':''" @click="flt='upd'">Con update<span class="fcount"
              x-text="page&&page!=='ov'?pageStats.upd:mUpd"></span></button>
          <button :class="flt==='off'?'on':''" @click="flt='off'">Offline<span class="fcount"
              x-text="page&&page!=='ov'?pageStats.off:mErr"></span></button>
          <button :class="flt==='wp'?'on':''" @click="flt='wp'">WordPress<span class="fcount"
              x-text="page&&page!=='ov'?pageStats.wp:sites.filter(s=>s.cms==='wp').length"></span></button>
          <button :class="flt==='joomla'?'on':''" @click="flt='joomla'">Joomla<span class="fcount"
              x-text="page&&page!=='ov'?pageStats.joomla:sites.filter(s=>s.cms==='joomla').length"></span></button>
        </div>
      </div>

      <!-- chip tag / cartelle (solo nella vista "tutti i siti") -->
      <template x-if="allTags.length && !page">
        <div class="tagbar">
          <span class="lbl">Cartelle:</span>
          <span class="tchip" :class="tagFilter===''?'on':''" @click="tagFilter=''">Tutte</span>
          <template x-for="t in allTags" :key="t.name">
            <span class="tchip" :class="tagFilter.toLowerCase()===t.name.toLowerCase()?'on':''"
              @click="toggleTagFilter(t.name)">
              <span x-text="t.name"></span><span class="c" x-text="t.count"></span>
            </span>
          </template>
        </div>
      </template>

      <!-- barra azioni selezione multipla -->
      <template x-if="selMode">
        <div class="selbar">
          <span class="cnt" x-text="selIds.length + ' selezionati'"></span>
          <button @click="selectAllFiltered()" x-text="allFilteredSelected?'Deseleziona tutti':'Seleziona tutti'"></button>
          <span class="sp"></span>
          <button class="primary" :disabled="!selIds.length || massBusy" @click="massUpdateSelected()">
            <span x-show="!massBusy">⬆ Aggiorna selezionati</span>
            <span x-show="massBusy">Avvio…</span>
          </button>
          <button :disabled="!selIds.length" @click="openTagModal('add')">+ Aggiungi tag</button>
          <button class="danger" :disabled="!selIds.length" @click="openTagModal('remove')">− Rimuovi tag</button>
        </div>
      </template>

      <!-- ============ PANORAMICA CARTELLE ============ -->
      <template x-if="page==='ov'">
        <div class="ovwrap">
          <div class="ovtot">
            <div class="t"><b x-text="totStats.count"></b> siti totali</div>
            <div class="s warn" x-show="totStats.upd"><b x-text="totStats.upd"></b> con update · <span x-text="totStats.updTot"></span> aggiornamenti pendenti</div>
            <div class="s ok" x-show="!totStats.upd">Tutto aggiornato</div>
            <div class="s err" x-show="totStats.off"><b x-text="totStats.off"></b> offline</div>
            <div class="s mut"><span x-text="totStats.wp"></span> WordPress · <span x-text="totStats.joomla"></span> Joomla</div>
          </div>
          <div class="ovgrid">
            <template x-for="t in tagStats" :key="t.key">
              <div class="ovcard" :class="t.off?'has-off':(t.upd?'has-upd':'')" @click="setPage(t.key)">
                <div class="nm">📁 <span x-text="t.name"></span></div>
                <div class="cnt"><b x-text="t.count"></b> siti <span class="mut">(<span x-text="t.wp"></span> WP · <span x-text="t.joomla"></span> J)</span></div>
                <div class="row warn" x-show="t.upd"><b x-text="t.upd"></b> con update · <span x-text="t.updTot"></span> agg. pendenti</div>
                <div class="row ok" x-show="!t.upd && !t.off">Tutto ok</div>
                <div class="row err" x-show="t.off"><b x-text="t.off"></b> offline</div>
              </div>
            </template>
            <template x-if="!tagStats.length">
              <div class="mut" style="padding:20px">Nessuna cartella: assegna dei tag ai siti (Seleziona → + Aggiungi tag) e qui compariranno le cartelle.</div>
            </template>
          </div>
        </div>
      </template>

      <!-- metriche -->
      <div class="metrics" x-show="page!=='ov'">
        <div class="metric">
          <div class="l">Siti OK</div>
          <div class="n" style="color:var(--ok)" x-text="mOk"></div>
        </div>
        <div class="metric">
          <div class="l">Con update</div>
          <div class="n" style="color:var(--warn)" x-text="mUpd"></div>
        </div>
        <div class="metric">
          <div class="l">Offline</div>
          <div class="n" style="color:var(--err)" x-text="mErr"></div>
        </div>
        <div class="metric">
          <div class="l">Auto-update</div>
          <div class="n" x-text="mAuto"></div>
        </div>
      </div>

      <!-- ===== LISTA ===== -->
      <template x-if="view==='list' && page!=='ov'">
        <div class="listwrap">
          <div class="lhead">
            <div></div>
            <div>Sito</div>
            <div>CMS</div>
            <div>Core</div>
            <div>Aggiornamenti</div>
            <div style="text-align:right">Azioni</div>
          </div>
          <template x-for="s in filtered" :key="s.id">
            <div class="lrow" :class="[rowClass(s), (selMode && isSel(s.id))?'r-ok':'']" @click="rowClick(s)">
              <template x-if="selMode">
                <input type="checkbox" class="selck" :checked="isSel(s.id)" @click.stop="toggleSel(s.id)">
              </template>
              <template x-if="!selMode">
                <div class="dot" :class="dotClass(s)" :title="statusLabel(s)"></div>
              </template>
              <div>
                <div class="lname" x-text="s.name"></div>
                <div class="lurl" x-text="hostOf(s.url)"></div>
                <template x-if="siteTags(s).length">
                  <div class="tags-mini">
                    <template x-for="t in siteTags(s)" :key="t">
                      <span class="tmini" x-text="t" @click.stop="tagFilter=t"></span>
                    </template>
                  </div>
                </template>
              </div>
              <div><span class="badge" :class="s.cms==='wp'?'b-wp':'b-joomla'"
                  x-text="s.cms==='wp'?'WP':'Joomla'"></span></div>
              <div>
                <span :class="s.core_update?'vup':'vok'" x-text="(s.core_update?'↑ ':'')+(s.core_current||'—')"></span>
              </div>
              <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                <template x-if="s.status && s.status!=='ok'"><span class="sbadge sb-err">Offline</span></template>
                <template x-if="!s.status"><span class="sbadge sb-unk">mai controllato</span></template>
                <template x-if="s.status==='ok' && updTotal(s)>0"><span class="sbadge sb-upd"
                    x-text="updTotal(s)+' update'"></span></template>
                <template x-if="s.status==='ok' && updTotal(s)===0"><span class="sbadge sb-ok">OK</span></template>
              </div>
              <div class="lact" @click.stop>
                <button @click="refresh(s)" title="Check">⟳</button>
                <button @click="goAdmin(s)" title="Admin">↗</button>
              </div>
            </div>
          </template>
          <template x-if="filtered.length===0">
            <div style="padding:30px;text-align:center" class="mut">Nessun sito.</div>
          </template>
        </div>
      </template>

      <!-- ===== CARD ===== -->
      <template x-if="view==='cards' && page!=='ov'">
        <div class="grid">
          <template x-for="s in filtered" :key="s.id">
            <div class="card" :class="[selMode?'selon':'', (selMode && isSel(s.id))?'selpick':'']">
              <template x-if="selMode">
                <input type="checkbox" class="selovl" :checked="isSel(s.id)" @click.stop="toggleSel(s.id)">
              </template>
              <div class="shot" @click="selMode ? toggleSel(s.id) : detail(s)"
                :style="s.shot_path ? `background-image:url(/api/sites/${s.id}/image?t=${s.shot_at}&k=${imageToken})` : ''">
                <template x-if="!s.shot_path">
                  <div class="ph">nessuno screenshot</div>
                </template>
              </div>
              <div class="cbody">
                <div class="row">
                  <span class="dot" :class="dotClass(s)"></span>
                  <span class="lname" x-text="s.name"></span>
                  <div class="sp"></div>
                  <span class="badge" :class="s.cms==='wp'?'b-wp':'b-joomla'"
                    x-text="s.cms==='wp'?'WP':'Joomla'"></span>
                </div>
                <div class="lurl" x-text="hostOf(s.url)"></div>
                <template x-if="siteTags(s).length">
                  <div class="tags-mini">
                    <template x-for="t in siteTags(s)" :key="t">
                      <span class="tmini" x-text="t" @click.stop="tagFilter=t"></span>
                    </template>
                  </div>
                </template>
                <div class="row" style="gap:6px">
                  <span :class="s.core_update?'vup':'vok'"
                    x-text="'core '+(s.core_current||'—')+(s.core_update?' ↑':' ✓')"></span>
                  <div class="sp"></div>
                  <template x-if="updTotal(s)>0"><span class="pill w" x-text="updTotal(s)+' update'"></span></template>
                </div>
                <div class="actions">
                  <button @click="refresh(s)">Check</button>
                  <button @click="shoot(s)">Shot</button>
                  <button @click="goAdmin(s)">Admin</button>
                  <button @click="detail(s)">Dettagli</button>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>

    </div>
  </template>

  <!-- ============ MODALE TAG / CARTELLE ============ -->
  <template x-if="tagModal">
    <div class="modal" @click.self="tagModal=null" @keydown.escape.window="tagModal=null">
      <div class="panel" style="max-width:460px">
        <div class="row">
          <h2 x-text="tagModal==='add' ? 'Aggiungi tag' : 'Rimuovi tag'"></h2>
          <div class="sp"></div>
          <button @click="tagModal=null">✕</button>
        </div>
        <div class="mut" x-text="selIds.length + ' siti selezionati'"></div>

        <template x-if="tagModal==='add'">
          <div style="margin-top:12px">
            <label>Tag (separa con virgola per più tag)</label>
            <input class="taginput" x-model="tagInput" list="tagsuggest"
              placeholder="es. clienteRossi, fascia1, onprem" @keydown.enter="applyTags()">
            <div class="mut" style="margin-top:6px">I tag esistenti compaiono come suggerimenti mentre digiti.</div>
          </div>
        </template>

        <template x-if="tagModal==='remove'">
          <div style="margin-top:12px">
            <label>Seleziona i tag da rimuovere dai siti selezionati</label>
            <div class="tagbar" style="padding:8px 0">
              <template x-if="!allTags.length"><span class="mut">Nessun tag presente.</span></template>
              <template x-for="t in allTags" :key="t.name">
                <span class="tchip" :class="rmTags.some(x=>x.toLowerCase()===t.name.toLowerCase())?'on':''"
                  @click="toggleRmTag(t.name)" x-text="t.name"></span>
              </template>
            </div>
          </div>
        </template>

        <div class="err-msg" x-show="tagErr" x-text="tagErr"></div>
        <div class="ok-msg" x-show="tagMsg" x-text="tagMsg"></div>

        <div class="row" style="gap:8px;margin-top:14px">
          <div class="sp"></div>
          <button @click="tagModal=null">Annulla</button>
          <button class="primary" :disabled="tagBusy" @click="applyTags()"
            x-text="tagModal==='add' ? 'Aggiungi' : 'Rimuovi'"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ MODALE DETTAGLI ============ -->
  <template x-if="sel">
    <div class="modal" @click.self="sel=null" @keydown.escape.window="sel=null">
      <div class="panel">
        <div class="row">
          <h2 x-text="sel.name"></h2>
          <div class="sp"></div>
          <button @click="sel=null">✕</button>
        </div>
        <div class="lurl" x-text="sel.url"></div>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <span class="badge" :class="sel.cms==='wp'?'b-wp':'b-joomla'"
            x-text="sel.cms==='wp'?'WordPress':'Joomla'"></span>
          <span :class="sel.core_update?'vup':'vok'" x-text="'core '+(sel.core_current||'—')"></span>
          <span class="mut" x-text="'PHP '+(sel.php_version||'?')"></span>
        </div>
        <div class="row" style="gap:6px">
          <button @click="refresh(sel)">Check ora</button>
          <button @click="shoot(sel)">Screenshot</button>
          <button @click="goAdmin(sel)">Admin</button>
          <button @click="openEdit(sel)">Modifica</button>
          <div class="sp"></div>
          <button class="danger" @click="del(sel)">Elimina</button>
        </div>

        <template x-for="g in groups(sel.extensions)" :key="g.title">
          <div>
            <div class="grp grp-acc" @click="toggleGrp(g.title)">
              <span x-text="g.title"></span>
              <span class="grp-meta">
                <template x-if="g.updcount>0"><span class="pill w" x-text="g.updcount+' update'"></span></template>
                <span class="mut" x-text="g.items.length"></span>
                <span x-text="openGrps.includes(g.title)?'▾':'▸'"></span>
              </span>
            </div>
            <template x-if="openGrps.includes(g.title)">
              <div style="padding:4px 0">
                <template x-for="x in g.items" :key="x.type+x.slug">
                  <div class="extrow">
                    <span>
                      <span x-text="x.name"></span>
                      <br>
                      <span class="mut" style="font-size:11px;font-family:ui-monospace,monospace;cursor:pointer"
                        @click.stop="copy(x.slug)" :title="'Copia slug: '+x.slug"
                        x-text="x.slug"></span>
                    </span>
                    <span class="v">
                      <template x-if="x.update_available">
                        <span class="vup" x-text="x.current_version+' → '+x.new_version"></span>
                      </template>
                      <template x-if="!x.update_available">
                        <span class="mut" x-text="x.current_version"></span>
                      </template>
                      <template x-if="x.dlkey_missing"><span class="pill k" style="margin-left:6px">no
                          key</span></template>
                    </span>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- ============ MODALE MODIFICA ============ -->
  <template x-if="edit">
    <div class="modal" style="z-index:20">
      <div class="panel">
        <div class="row">
          <h2>Modifica sito</h2>
          <div class="sp"></div>
          <button @click="edit=null">✕</button>
        </div>
        <div><label>Nome</label><input x-model="edit.name"></div>
        <div><label>URL (senza slash finale)</label><input x-model="edit.url"></div>
        <div><label>CMS</label>
          <select x-model="edit.cms">
            <option value="wp">WordPress</option>
            <option value="joomla">Joomla</option>
          </select>
        </div>
        <div><label>URL admin (es. login custom)</label><input x-model="edit.admin_url"
            placeholder="vuoto = /administrator o /wp-admin"></div>
        <div><label>Token</label><input x-model="edit.token"></div>
        <div><label>Gruppo</label><input x-model="edit.group"></div>

                  <div style="flex:1;min-width:0">
                    <div><span x-text="r.site_name"></span>
                      <span class="mut" style="font-size:11px;font-family:ui-monospace,monospace" x-show="r.req_slug" x-text="' · '+r.req_slug"></span>

        </div>
