<!doctype html>
<html lang="it" data-project="panopticon-lite">
<head>
  <meta charset="utf-8">
  <script src="/static/i18n/catalog.js"></script>
  <script src="/static/i18n/i18n.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel TD</title>
  <link id="app-favicon" rel="icon" href="/api/branding/favicon">
  <!-- font e librerie in locale: nessuna dipendenza da CDN esterni -->
  <link rel="stylesheet" href="/static/vendor/inter.css">
  <link rel="stylesheet" href="/static/sentinel/sentinel.css">
  <script src="/static/sentinel/app.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>

  <link rel="stylesheet" href="/static/i18n/i18n.css">
</head>
<body x-data="sentinel()" x-cloak>

<!-- ===================== LOGIN ===================== -->
<template x-if="!token">
  <div class="login">
    <div class="box card">
      <div class="brand"><img class="brand-logo" :src="brand.logo_url" alt="Tastiere Digitali"><div class="brand-app"><div class="name">Sentinel TD</div><div class="by">monitoraggio siti</div></div></div>
      <template x-if="step==='pwd'">
        <form @submit.prevent="login()">
          <div class="field"><label>Utente</label><input class="input" x-model="user" autocomplete="username" autofocus></div>
          <div class="field"><label>Password</label><input class="input" type="password" x-model="pwd" autocomplete="current-password"></div>
          <div class="msg err" x-show="err" x-text="err"></div>
          <button class="btn primary" style="width:100%;justify-content:center" type="submit">Entra</button>
        </form>
      </template>
      <template x-if="step==='2fa'">
        <div>
          <p class="mut small">Verifica in due passaggi</p>
          <template x-if="methods.includes('totp')">
            <form @submit.prevent="verifyTotp()">
              <div class="field"><label>Codice authenticator</label><input class="input mono" x-model="code" inputmode="numeric" autofocus placeholder="123456"></div>
              <button class="btn primary" style="width:100%;justify-content:center" type="submit">Verifica</button>
            </form>
          </template>
          <template x-if="methods.includes('passkey')">
            <button class="btn" style="width:100%;justify-content:center;margin-top:10px" @click="loginPasskey()">Usa passkey</button>
          </template>
          <div class="msg err" x-show="err" x-text="err"></div>
          <button class="btn ghost sm" style="margin-top:8px" @click="step='pwd';err=''">← indietro</button>
        </div>
      </template>
    </div>
    <div class="login-foot">Powered by <a href="https://www.tastieredigitali.it" target="_blank" rel="noopener noreferrer"><b>Tastiere Digitali</b></a> — Giuseppe Sciarra</div>
  </div>
</template>

<!-- ===================== APP ===================== -->
<template x-if="token">
  <div class="app">

    <!-- ---------- SIDEBAR ---------- -->
    <aside class="sidebar" :class="sideOpen?'open':''">
      <div class="brand sidebar-brand"><img class="brand-logo" :src="brand.logo_url" alt="Tastiere Digitali"><div class="brand-app"><div class="name">Sentinel TD</div><div class="by">monitoraggio siti</div></div></div>
      <nav class="nav">
        <a :class="route.page==='dashboard'?'on':''" href="#/">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span class="txt">Dashboard</span></a>
        <a :class="route.page==='sites'&&!route.folder?'on':''" href="#/sites">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          <span class="txt">Tutti i siti</span><span class="cnt" x-text="sites.length"></span></a>
        <a :class="route.page==='domain-expiries'?'on':''" href="#/domain-expiries">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          <span class="txt">Scadenze domini</span></a>
        <a :class="route.page==='component-expiries'?'on':''" href="#/component-expiries">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6v4h4v6h-4v8H9v-8H5V7h4z"/><path d="M9 7h6M9 13h6"/></svg>
          <span class="txt">Scadenze plugin / temi</span></a>
        <a :class="route.page==='security'?'on':''" href="#/security">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>
          <span class="txt">Sicurezza</span>
          <span class="cnt err" x-show="sec.summary&&sec.summary.critical" x-text="sec.summary?.critical"></span></a>
        <a :class="route.page==='history'?'on':''" href="#/history">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span class="txt">Storico 7 giorni</span></a>
        <a :class="route.page==='stats'?'on':''" href="#/stats">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M7 21V10M12 21V4M17 21v-7"/></svg>
          <span class="txt">Statistiche</span></a>

        <div class="lbl">Cartelle</div>
        <template x-for="f in folderTree" :key="f.name">
          <div>
            <a :class="route.folder===(f.tag||f.name)?'on':''" :href="'#/folder/'+encodeURIComponent(f.tag||f.name)">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <span class="txt" x-text="f.name"></span>
              <span class="cnt err" x-show="f.stats.off" x-text="f.stats.off"></span>
              <span class="cnt warn" x-show="f.stats.upd" x-text="f.stats.upd"></span>
              <span class="cnt" x-text="f.stats.count"></span></a>
            <div class="sub" x-show="f.subs.length">
              <template x-for="sf in f.subs" :key="sf.tag">
                <a :class="route.folder===sf.tag?'on':''" :href="'#/folder/'+encodeURIComponent(sf.tag)">
                  <span class="txt" x-text="sf.name"></span>
                  <span class="cnt warn" x-show="f.subStats[sf.name].upd" x-text="f.subStats[sf.name].upd"></span>
                  <span class="cnt" x-text="f.subStats[sf.name].count"></span></a>
              </template>
            </div>
          </div>
        </template>
        <a x-show="noFolder.length" :class="route.folder==='__none'?'on':''" href="#/folder/__none">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="txt">Senza cartella</span><span class="cnt" x-text="noFolder.length"></span></a>

        <div class="lbl">Sistema</div>
        <a :class="route.page==='notifications'?'on':''" href="#/notifications">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="txt">Notifiche</span></a>
        <a :class="route.page==='reports'?'on':''" href="#/reports">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
          <span class="txt">Report mensile</span></a>
        <a :class="route.page==='account'?'on':''" href="#/account">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span class="txt">Account</span></a>
        <a :class="route.page==='settings'?'on':''" href="#/settings">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span class="txt">Impostazioni</span></a>
      </nav>
      <div class="foot">
        <div><span x-text="meta.name"></span> <span class="ver" x-show="meta.version" x-text="'v'+meta.version"></span></div>
        <div><span x-text="sites.length"></span> siti monitorati · <a href="#" @click.prevent="logout()">Esci</a></div>
        <div class="by">Powered by <a :href="meta.vendor_url" target="_blank" rel="noopener noreferrer"><b x-text="meta.vendor"></b></a> — <span x-text="meta.author"></span></div>
      </div>
    </aside>
    <div class="overlay" x-show="sideOpen" @click="sideOpen=false" style="z-index:44"></div>

    <!-- ---------- MAIN ---------- -->
    <div class="main">
      <header class="topbar">
        <button class="btn icon ghost hamb" @click="sideOpen=!sideOpen"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="search" style="width:min(360px,100%)" x-show="route.page==='sites'||route.page==='dashboard'">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" placeholder="Cerca sito, url, cartella…" x-model="q" @keydown.enter="if(route.page!=='sites') go('sites')">
        </div>
        <div class="sp"></div>
        <span class="spinner" x-show="loading"></span>
        <button class="btn sm" @click="checkAll()">Check tutti</button>
        <button class="btn sm primary" @click="updateAll()">Aggiorna tutto</button>
        <button class="btn sm" @click="openNew()">+ Sito</button>
      </header>

      <main class="content">
        <div class="msg info" x-show="needs2faSetup">Non hai ancora configurato la verifica in due passaggi: <a href="#/settings">configurala nelle Impostazioni</a>.</div>

        <!-- ===== DASHBOARD ===== -->
        <template x-if="route.page==='dashboard'">
          <div>
            <h1 class="page-title">Dashboard</h1>
            <div class="page-sub">Stato del parco in tempo reale</div>
            <div class="grid kpi" style="margin:18px 0">
              <div class="card kpi ok" @click="flt='all';go('sites')"><div class="k">Siti OK</div><div class="v" x-text="totStats.count-totStats.off"></div><div class="d"><span x-text="totStats.wp"></span> WordPress · <span x-text="totStats.joomla"></span> Joomla</div></div>
              <div class="card kpi warn" @click="flt='upd';go('sites')"><div class="k">Con update</div><div class="v" x-text="totStats.upd"></div><div class="d">siti con aggiornamenti pendenti</div></div>
              <div class="card kpi err" @click="flt='off';go('sites')"><div class="k">Offline</div><div class="v" x-text="totStats.off"></div><div class="d">non raggiungibili all'ultimo check</div></div>
              <div class="card kpi acc" @click="go('history')"><div class="k">Update 7 giorni</div><div class="v" x-text="histSummary?histSummary.ok:'—'"></div><div class="d"><span x-text="histSummary?histSummary.failed:0"></span> falliti</div></div>
            </div>
            <div class="grid two">
              <div class="card">
                <h3>Aggiornamenti ultimi 7 giorni</h3>
                <div class="bars" x-show="histSummary">
                  <template x-for="d in (histSummary?histSummary.days:[])" :key="d.day">
                    <div class="b" :title="d.day+': '+d.ok+' ok, '+d.failed+' falliti'">
                      <div class="bv" x-show="d.ok+d.failed" x-text="d.ok+d.failed"></div>
                      <div class="seg failed" :style="'height:'+barH(d,'failed')"></div>
                      <div class="seg ok" :style="'height:'+barH(d,'ok')"></div>
                      <div class="lb" x-text="dayLbl(d.day)"></div>
                    </div>
                  </template>
                </div>
                <h3 style="margin-top:22px">Attività recente</h3>
                <div class="timeline">
                  <template x-for="h in history.slice(0,10)" :key="h.id">
                    <div class="ev">
                      <span class="dot" :class="h.ok?'ok':'err'" style="margin-top:6px"></span>
                      <div><b x-text="h.site_name"></b> · <span x-text="h.name"></span> <span class="mut mono small" x-text="h.from+' → '+h.to"></span><div class="err small" x-show="!h.ok" x-text="h.error"></div></div>
                      <div class="when" x-text="ago(h.at)"></div>
                    </div>
                  </template>
                  <div class="empty" x-show="!history.length">Nessun update negli ultimi 7 giorni</div>
                </div>
              </div>
              <div class="card">
                <h3>Da tenere d'occhio</h3>
                <div class="timeline">
                  <template x-for="(a,i) in attention" :key="i">
                    <div class="ev" style="grid-template-columns:18px 1fr">
                      <span class="dot" :class="a.kind" style="margin-top:6px"></span>
                      <div>
                        <a x-show="a.site" :href="'#/site/'+(a.site&&a.site.id)" x-text="a.site&&a.site.name"></a>
                        <a x-show="a.link" :href="'#/'+a.link">Centro sicurezza</a>
                        <div class="small" x-text="a.text"></div>
                      </div>
                    </div>
                  </template>
                  <div class="empty" x-show="!attention.length">Tutto tranquillo ✨</div>
                </div>
                <h3 style="margin-top:22px">Cartelle</h3>
                <template x-for="f in folderTree" :key="f.name">
                  <a class="row" style="padding:8px 0;border-bottom:1px solid var(--bd);color:inherit" :href="'#/folder/'+encodeURIComponent(f.tag||f.name)">
                    <span style="flex:1;font-weight:500" x-text="f.name"></span>
                    <span class="badge warn" x-show="f.stats.upd" x-text="f.stats.upd+' update'"></span>
                    <span class="badge err" x-show="f.stats.off" x-text="f.stats.off+' offline'"></span>
                    <span class="badge" x-text="f.stats.count+' siti'"></span>
                  </a>
                </template>
              </div>
            </div>

            <div class="card" style="margin-top:16px">
              <div class="row"><div style="flex:1"><b>Statistiche aggiornamenti</b><div class="small mut">Andamento mensile, classifiche dei siti e confronto fra periodi.</div></div>
              <a class="btn sm" href="#/stats">Apri statistiche →</a></div>
            </div>
          </div>
        </template>

        <!-- ===== STATISTICHE ===== -->
        <template x-if="route.page==='stats'">
          <div>
            <div class="row" style="flex-wrap:wrap"><div><h1 class="page-title">Statistiche aggiornamenti</h1><div class="page-sub">Andamento mensile, classifiche e confronto fra periodi — su tutto lo storico disponibile</div></div></div>
            <div style="margin-top:16px">
<div class="card" style="margin-top:16px" x-show="stats.data">
              <div class="row" style="flex-wrap:wrap;gap:10px">
                <div class="seg">
                  <button :class="stats.mode==='month'?'on':''" @click="stats.mode='month'">Un mese</button>
                  <button :class="stats.mode==='compare'?'on':''" @click="stats.mode='compare';loadCompare()">Confronta due mesi</button>
                </div>
                <span class="spinner" x-show="stats.busy"></span>
                <div class="sp"></div>
                <span class="small mut">Perimetro</span>
                <select class="input" style="max-width:210px" x-model="stats.scope" @change="loadStats(false)">
                  <template x-for="s in stats.scopes" :key="'sc'+s.key"><option :value="s.key" x-text="s.label"></option></template>
                </select>
                <button class="btn" @click="openTokenLink(() => statsPdfUrl())" title="Scarica in PDF quello che vedi: mese selezionato o confronto">⬇ Scarica PDF</button>
              </div>

              <!-- ANDAMENTO -->
              <div class="row" style="margin-top:16px;flex-wrap:wrap;gap:10px">
                <div style="flex:1;min-width:220px">
                  <b style="font-size:13px">Andamento</b>
                  <div class="small mut">Aggiornamenti applicati per mese — <b>clicca una barra</b> per vedere il dettaglio di quel mese</div>
                </div>
                <select class="input small" style="max-width:120px" x-model.number="stats.months" @change="loadStats(false)">
                  <option value="6">6 mesi</option><option value="12">12 mesi</option><option value="24">24 mesi</option>
                </select>
              </div>
              <div class="bars" style="height:150px;margin-top:10px" x-show="!statEmptyWindow">
                <template x-for="m in (stats.trend?stats.trend.months:[])" :key="'t'+m.period">
                  <div class="b" style="cursor:pointer" :class="m.period===stats.period?'sel':''"
                       :title="m.label+': '+m.updates+' aggiornamenti · '+m.sites+' siti · '+m.failed+' falliti'"
                       @click="pickMonth(m.period)">
                    <div class="bv" x-show="m.updates" x-text="m.updates"></div>
                    <div class="seg ok" :style="'height:'+statTrendH(m)+';opacity:'+(m.period===stats.period?1:.55)"></div>
                    <div class="lb" x-text="shortMonth(m.label)"></div>
                  </div>
                </template>
              </div>
              <div class="empty" x-show="statEmptyWindow" style="padding:28px">Nessun aggiornamento registrato negli ultimi <span x-text="stats.months"></span> mesi in questo perimetro.</div>

              <!-- MODALITÀ MESE -->
              <template x-if="stats.mode==='month' && stats.data">
                <div>
                  <div class="row" style="margin:20px 0 4px;flex-wrap:wrap;gap:10px;border-top:1px solid var(--bd);padding-top:16px">
                    <div style="flex:1;min-width:200px"><b style="font-size:15px" x-text="stats.data.period_label"></b>
                      <div class="small mut">Dettaglio del mese selezionato · confronto con <span x-text="stats.data.prev_label"></span></div></div>
                    <div class="row" style="gap:4px">
                      <button class="btn icon" :disabled="!canShiftStat(-1)" @click="shiftStatMonth(-1)" title="Mese precedente (freccia ←)">‹</button>
                      <select class="input" style="max-width:190px" x-model="stats.period" @change="pickMonth(stats.period)">
                        <template x-for="m in statMonths" :key="'pp'+m.period"><option :value="m.period" x-text="m.label+(m.updates?' — '+m.updates+' update':'')"></option></template>
                      </select>
                      <button class="btn icon" :disabled="!canShiftStat(1)" @click="shiftStatMonth(1)" title="Mese successivo (freccia →)">›</button>
                    </div>
                  </div>
                  <div class="grid kpi" style="margin:10px 0 6px">
                    <div class="card kpi acc"><div class="k">Aggiornamenti</div><div class="v" x-text="stats.data.totals.updates"></div>
                      <div class="d"><span :class="statDelta(stats.data.totals.updates,stats.data.prev_totals.updates).cls" x-text="statDelta(stats.data.totals.updates,stats.data.prev_totals.updates).txt"></span> vs <span x-text="stats.data.prev_label"></span></div></div>
                    <div class="card kpi ok"><div class="k">Siti aggiornati</div><div class="v" x-text="stats.data.totals.sites"></div>
                      <div class="d"><span :class="statDelta(stats.data.totals.sites,stats.data.prev_totals.sites).cls" x-text="statDelta(stats.data.totals.sites,stats.data.prev_totals.sites).txt"></span></div></div>
                    <div class="card kpi"><div class="k">Componenti diversi</div><div class="v" x-text="stats.data.totals.components"></div>
                      <div class="d"><span :class="statDelta(stats.data.totals.components,stats.data.prev_totals.components).cls" x-text="statDelta(stats.data.totals.components,stats.data.prev_totals.components).txt"></span></div></div>
                    <div class="card kpi err"><div class="k">Non riusciti</div><div class="v" x-text="stats.data.totals.failed"></div>
                      <div class="d"><span :class="statDeltaFail(stats.data.totals.failed,stats.data.prev_totals.failed).cls" x-text="statDeltaFail(stats.data.totals.failed,stats.data.prev_totals.failed).txt"></span></div></div>
                  </div>

                  <div class="grid two" style="margin-top:14px">
                    <div>
                      <h3>Siti più aggiornati — <span x-text="stats.data.period_label"></span></h3>
                      <template x-for="(s, si) in stats.data.top_sites" :key="'ts'+s.site_id">
                        <a class="statrow" :href="'#/site/'+s.site_id">
                          <div class="nm"><span class="cdot" :style="'background:'+colorIdx(si)"></span><span class="cms" :class="s.cms" x-text="s.cms==='wp'?'WP':'J'"></span> <span x-text="s.name"></span></div>
                          <div class="bar"><div class="fill" :style="'width:'+statBar(s.updates, stats.data.max_site)+';background:'+colorGradIdx(si)"></div></div>
                          <div class="val"><b x-text="s.updates"></b>
                            <span class="small" :class="s.delta>0?'ok':(s.delta<0?'err':'mut')" x-text="(s.delta>0?'+':'')+s.delta"></span>
                            <span class="badge err" x-show="s.failed" x-text="s.failed+' ko'"></span></div>
                        </a>
                      </template>
                      <div class="empty" x-show="!stats.data.top_sites.length">Nessun aggiornamento registrato in <span x-text="stats.data.period_label"></span></div>
                    </div>
                    <div>
                      <h3>Componenti più aggiornati</h3>
                      <template x-for="(c, ci) in stats.data.top_components" :key="'tc'+c.name">

                    <span class="small mut">con</span>
                    <select class="input" style="max-width:170px" x-model="stats.cmpB" @change="loadCompare()">

                        <div class="card kpi acc"><div class="k" x-text="stats.cmp.b.label"></div><div class="v" x-text="stats.cmp.b.updates"></div><div class="d"><span x-text="stats.cmp.b.sites"></span> siti · <span x-text="stats.cmp.b.components"></span> componenti</div></div>
                        <div class="card kpi"><div class="k">Variazione</div>

                                <td><span class="cdot" :style="'background:'+colorIdx(ri)"></span><span class="cms" :class="r.cms" x-text="r.cms==='wp'?'WP':'J'"></span> <span x-text="r.name"></span></td>
                                <td class="num" x-text="r.a"></td>
                                <td class="num"><b x-text="r.b"></b></td>
                                <td class="num"><span :class="r.delta>0?'ok':(r.delta<0?'err':'mut')" x-text="(r.delta>0?'+':'')+r.delta+(r.pct===null?'':' ('+(r.delta>0?'+':'')+r.pct+'%)')"></span></td>
                                <td class="hide-m" style="width:120px"><div class="bar" style="margin:0"><div class="fill" :style="'width:'+statBar(r.b, stats.cmp.max)+';background:'+colorGradIdx(ri)"></div></div></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>

                      </div>
                      <h3 style="margin-top:18px">Componenti — differenze</h3>
                      <div class="tbl-wrap">
                        <table class="tbl responsive">
                          <thead><tr><th>Componente</th><th class="n" x-text="stats.cmp.a.label"></th><th class="n" x-text="stats.cmp.b.label"></th><th class="n">Variazione</th></tr></thead>
                          <tbody>
                            <template x-for="(c, cci) in stats.cmp.components" :key="'cc'+c.name">
                              <tr><td><span class="cdot" :style="'background:'+colorIdx(cci)"></span><span x-text="c.name"></span></td><td class="num" x-text="c.a"></td><td class="num"><b x-text="c.b"></b></td>
                                <td class="num"><span :class="c.delta>0?'ok':(c.delta<0?'err':'mut')" x-text="(c.delta>0?'+':'')+c.delta"></span></td></tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
            </div>

          </div>
        </template>

        <!-- ===== SITES (tutti / cartella) ===== -->
        <template x-if="route.page==='sites'">

            <div class="tbl-wrap">

                  <th>Cartelle</th>
                  <th class="sort" @click="sortBy('core_current')">CMS / core</th>
                  <th>PHP</th>
                  <th>Dominio</th>
                  <th class="sort" @click="sortBy('updates')">Update</th>
                  <th class="sort" @click="sortBy('checked')">Check</th>
                  <th></th>
                </tr></thead>
                <tbody>
                  <template x-for="s in filtered" :key="s.id">
                    <tr class="row" :class="selIds.includes(s.id)?'selected':''" @click="selMode?toggleSel(s.id):go('site/'+s.id)">
                      <td x-show="selMode" @click.stop><input type="checkbox" :checked="selIds.includes(s.id)" @change="toggleSel(s.id)"></td>
                      <td><span class="dot" :class="isOff(s)?'err':(hasUpd(s)?'warn':'ok')" :title="isOff(s)?(s.error||'offline'):(hasUpd(s)?'update disponibili':'ok')"></span></td>

                          <span class="ini" x-show="!s.shot_path" x-text="initials(s.name)"></span>
                        </span>
                        <span style="min-width:0">
                          <span class="name" x-text="s.name"></span>
                          <span class="url" x-text="s.url.replace(/^https?:\/\//,'')"></span>

                        </span>
                      </div></td>
                      <td class="hide-m"><template x-for="t in siteTags(s)" :key="t"><button type="button" class="chip click-chip" @click.stop="go('folder/'+encodeURIComponent(t))" x-text="t" title="Apri cartella"></button></template><span class="mut small" x-show="!siteTags(s).length">—</span></td>
                      <td><span class="cms" :class="s.cms" x-text="s.cms==='wp'?'WP':'JOOMLA'"></span> <span class="mono small" x-text="coreLabel(s)"></span> <span class="badge warn" x-show="s.core_update" x-text="'→ '+s.core_latest"></span></td>
                      <td class="hide-m"><span class="mono small" x-text="s.php_version||'—'"></span> <span class="badge" :class="phpState(s.php_version).cls" x-show="phpState(s.php_version).label" x-text="phpState(s.php_version).label"></span></td>
                      <td class="hide-m"><span class="badge" :class="expiryClass(s.domain_expires_at)" x-show="s.domain_expires_at" x-text="expiryText(s.domain_expires_at)"></span><span class="mut small" x-show="!s.domain_expires_at">—</span></td>
                      <td class="num"><span class="badge warn" x-show="hasUpd(s)" x-text="s.updates_count"></span><span class="badge ok" x-show="!hasUpd(s)&&!isOff(s)">ok</span><span class="badge err" x-show="isOff(s)">offline</span></td>
                      <td class="hide-m mut small" x-text="ago(s.last_checked)"></td>
                      <td @click.stop><div class="acts">
                        <button class="btn sm icon" title="Check" @click="check(s)" :disabled="busy[s.id]"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg></button>
                        <button class="btn sm icon" title="Aggiorna ora" @click="updateNow(s)" x-show="hasUpd(s)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M6 9l6-6 6 6M4 21h16"/></svg></button>
                        <button class="btn sm icon" title="Apri admin" @click="goAdmin(s)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M9 6H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/></svg></button>
                      </div></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="empty" x-show="!filtered.length">Nessun sito corrisponde ai filtri</div>

              <button class="btn sm" @click="setAutoSelected(false)">Auto-update OFF</button>
              <div class="sp"></div>
              <button class="btn sm ghost" @click="exitSel()">Annulla</button>
            </div>
          </div>

        <!-- ===== SITE DETAIL ===== -->
        <template x-if="route.page==='site'&&detail">

              <div class="grid two site-tab">

                  <div class="kv">
                    <div class="k">CMS</div><div><span class="cms" :class="detail.cms" x-text="detail.cms==='wp'?'WP':'JOOMLA'"></span> <span class="mono" x-text="detail.core_current"></span> <span class="badge warn" x-show="detail.core_update" x-text="'disponibile '+detail.core_latest"></span></div>
                    <div class="k">PHP</div><div><span class="mono" x-text="detail.php_version||'—'"></span> <span class="badge" :class="phpState(detail.php_version).cls" x-show="phpState(detail.php_version).label" x-text="phpState(detail.php_version).label"></span></div>
                    <div class="k">Dominio</div><div><span x-text="detail.domain_name||'—'"></span> <span class="badge" :class="expiryClass(detail.domain_expires_at)" x-show="detail.domain_expires_at" x-text="expiryText(detail.domain_expires_at)"></span></div>
                    <div class="k">Notifiche</div><div><span class="badge" :class="detail.notifications_silenced?'warn':'ok'" x-text="detail.notifications_silenced?'silenziate':'attive'"></span></div>

                    <div class="k">Plugin</div><div><span x-text="detail.tot_plugins"></span> installati · <span :class="detail.upd_plugins?'warn':''" x-text="detail.upd_plugins+' da aggiornare'"></span></div>

                    <div class="k">Cartelle</div><div><template x-for="t in siteTags(detail)" :key="t"><span class="chip" x-text="t"></span></template><span class="mut" x-show="!siteTags(detail).length">—</span></div>

        <template x-if="route.page==='domain-expiries'">

              <div class="card kpi acc"><div class="k">Domini censiti</div><div class="v" x-text="exp.domains.length"></div></div>

            <div class="tbl-wrap"><table class="tbl responsive"><thead><tr><th>Dominio principale</th><th>Sito / siti monitorati</th><th>Data scadenza</th><th>Tempo residuo</th><th>Ultimo controllo</th><th>Stato scansione</th></tr></thead><tbody>
              <template x-for="x in exp.domains" :key="x.id"><tr><td><b class="mono" x-text="x.name"></b></td><td><div class="name" x-text="x.site_names?.join(', ')"></div><div class="small mut" x-show="x.site_count>1" x-text="x.site_count+' siti sullo stesso dominio'"></div></td><td><b x-text="x.expires_at?fmtDay(x.expires_at):'Non disponibile'"></b></td><td><span x-show="x.days!==null" class="badge" :class="expiryDaysClass(x.days)" x-text="expiryDaysText(x.days)"></span><span x-show="x.days===null" class="mut">—</span></td><td class="small" x-text="fmtDate(x.checked_at)"></td><td><span class="small mut" x-show="!x.error&&x.expires_at">OK</span><span class="small warn" x-show="x.error" x-text="x.error"></span><span class="small mut" x-show="!x.error&&!x.expires_at">Da scansionare</span></td></tr></template>
