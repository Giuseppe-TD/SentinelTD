            <div class="row" style="flex-wrap:wrap"><div><h1 class="page-title">Scadenze plugin / temi</h1><div class="page-sub">Registro globale delle licenze. Non sono associate a un singolo sito: indichi solo se valgono per WordPress, Joomla o entrambi.</div></div><div class="sp"></div><span class="spinner" x-show="exp.loadingComponents"></span><button class="btn sm primary" @click="newExpiry()">+ Plugin / tema / licenza</button></div>
            <div class="grid kpi" style="margin:18px 0">
              <div class="card kpi acc"><div class="k">Licenze registrate</div><div class="v" x-text="exp.components.length"></div></div>
              <div class="card kpi warn"><div class="k" x-text="'Entro '+prefs.expiry_warning_days+' giorni'"></div><div class="v" x-text="exp.components.filter(x=>x.days!==null&&x.days>=0&&x.days<=prefs.expiry_warning_days).length"></div></div>
              <div class="card kpi err"><div class="k">Scadute</div><div class="v" x-text="exp.components.filter(x=>x.days!==null&&x.days<0).length"></div></div>
              <div class="card kpi ok"><div class="k">Oltre soglia</div><div class="v" x-text="exp.components.filter(x=>x.days!==null&&x.days>prefs.expiry_warning_days).length"></div></div>
            </div>
            <div class="tbl-wrap"><table class="tbl responsive"><thead><tr><th>Plugin / tema / licenza</th><th>Piattaforma</th><th>Fornitore</th><th>Data scadenza</th><th>Tempo residuo</th><th>Note</th><th></th></tr></thead><tbody>
              <template x-for="x in exp.components" :key="x.id"><tr><td><b x-text="x.name"></b></td><td><span class="badge" :class="x.platform==='wp'?'wp':(x.platform==='joomla'?'joomla':'')" x-text="platformLabel(x.platform)"></span></td><td x-text="x.provider||'—'"></td><td><b x-text="fmtDay(x.expires_at)"></b><div class="small mut" x-text="x.recur_label"></div></td><td><span class="badge" :class="expiryDaysClass(x.days)" x-text="expiryDaysText(x.days)"></span></td><td class="small mut" x-text="x.notes||'—'"></td><td><div class="acts" style="opacity:1"><button class="btn sm primary" x-show="x.recur_months>0" @click="renewExpiry(x)" title="Sposta la scadenza avanti di un periodo">↻ Rinnovata</button><button class="btn sm" @click="editExpiry(x)">Modifica</button><button class="btn sm danger" @click="deleteExpiry(x)">Elimina</button></div></td></tr></template>
            </tbody></table><div class="empty" x-show="!exp.loadingComponents&&!exp.components.length">Nessuna licenza registrata.</div></div>
          </div>
        </template>

        <!-- ===== SECURITY ===== -->
        <template x-if="route.page==='security'">
          <div>
            <div class="row" style="flex-wrap:wrap"><div><h1 class="page-title">Centro sicurezza</h1><div class="page-sub">Vulnerabilità note sulle estensioni installate · ultima scansione <span x-text="sec.summary?fmtDate(sec.summary.last_scan):'—'"></span></div></div><div class="sp"></div><button class="btn sm" @click="scanNow()">Scansiona ora</button></div>
            <div class="grid kpi" style="margin:18px 0" x-show="sec.summary">
              <div class="card kpi err" @click="sec.sev='critical'"><div class="k">Critiche</div><div class="v" x-text="sec.summary?.critical"></div><div class="d"><span x-text="sec.summary?.exploited"></span> sfruttate attivamente</div></div>
              <div class="card kpi warn" @click="sec.sev='high'"><div class="k">Alte</div><div class="v" x-text="sec.summary?.high"></div></div>
              <div class="card kpi" @click="sec.sev='medium'"><div class="k">Medie / basse</div><div class="v" x-text="(sec.summary?.medium||0)+(sec.summary?.low||0)"></div></div>
              <div class="card kpi acc" @click="sec.sev=''"><div class="k">Siti coinvolti</div><div class="v" x-text="sec.summary?.sites_affected"></div><div class="d">totale <span x-text="sec.summary?.total"></span> match</div></div>
            </div>
            <div class="chips" style="margin-bottom:12px">
              <span class="fchip" :class="sec.sev===''?'on':''" @click="sec.sev=''">Tutte</span>
              <template x-for="sv in ['critical','high','medium','low']" :key="sv"><span class="fchip" :class="sec.sev===sv?'on':''" @click="sec.sev=sv" x-text="sv"></span></template>
            </div>
            <div class="tbl-wrap">
              <table class="tbl responsive">
                <thead><tr><th>Sev.</th><th>Sito</th><th>Estensione</th><th>CVE</th><th>Installata</th><th>Fix in</th><th></th></tr></thead>
                <tbody>
                  <template x-for="m in sec.items.filter(x=>!sec.sev||x.severity===sec.sev)" :key="m.match_id">
                    <tr>
                      <td><span class="badge" :class="m.severity==='critical'?'err':(m.severity==='high'?'warn':'')" x-text="m.severity"></span> <span class="badge err" x-show="m.exploited">exploited</span></td>
                      <td><a :href="'#/site/'+m.site_id" x-text="m.site_name"></a></td>
                      <td><span x-text="m.ext_name||m.ext_slug"></span></td>
                      <td><a :href="m.url" target="_blank" class="mono" x-text="m.cve_id"></a><div class="small mut" x-text="m.title"></div></td>
                      <td class="mono" x-text="m.site_version"></td>
                      <td class="mono" x-text="m.version_fixed||'—'"></td>
                      <td class="hide-m small mut" x-text="ago(m.first_seen)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="empty" x-show="!sec.loading&&!sec.items.length">Nessuna vulnerabilità attiva 🎉</div>
            </div>
          </div>
        </template>

        <!-- ===== HISTORY ===== -->
        <template x-if="route.page==='history'">
          <div>
            <h1 class="page-title">Storico aggiornamenti</h1>
            <div class="page-sub">Ultimi 7 giorni · <span x-text="histSummary?histSummary.ok:0"></span> riusciti · <span x-text="histSummary?histSummary.failed:0"></span> falliti</div>
            <div class="card" style="margin-top:16px"><div class="timeline">
              <template x-for="h in history" :key="h.id">
                <div class="ev"><span class="dot" :class="h.ok?'ok':'err'" style="margin-top:6px"></span><div><a :href="'#/site/'+h.site_id" x-text="h.site_name"></a> · <b x-text="h.name"></b> <span class="badge" x-text="h.type"></span> <span class="mono small mut" x-text="h.from+' → '+h.to"></span><div class="err small" x-show="!h.ok" x-text="h.error"></div></div><div class="when" x-text="fmtDate(h.at)"></div></div>
              </template>
              <div class="empty" x-show="!history.length">Nessun update negli ultimi 7 giorni</div>
            </div></div>
          </div>
        </template>

        <!-- ===== REPORT MENSILE ===== -->
        <template x-if="route.page==='reports'">
          <div>
            <div class="row" style="flex-wrap:wrap;gap:10px">
              <div><h1 class="page-title">Report mensile</h1><div class="page-sub">PDF intestato con il riepilogo del mese, inviato per email in automatico.</div></div>
              <div class="sp"></div>
              <select class="input" style="max-width:210px" x-model="rep.scope" @change="repScopeChanged()">
                <template x-for="s in rep.scopes" :key="s.key"><option :value="s.key" x-text="s.label+' ('+s.sites+' siti)'"></option></template>
              </select>
              <select class="input" style="max-width:190px" x-model="rep.period" @change="repScopeChanged()">
                <template x-for="p in rep.periods" :key="p.period"><option :value="p.period" x-text="p.label+' — '+p.updates+' update'"></option></template>
              </select>
              <button class="btn" @click="openTokenLink(() => reportPdfUrl())">⬇ Scarica PDF</button>
              <button class="btn" :disabled="rep.busy" @click="sendReportNow(false)">Invia questo</button>
              <button class="btn primary" :disabled="rep.busy||!repEnabledCount" @click="sendReportNow(true)"><span class="spinner" x-show="rep.busy"></span> Invia tutti (<span x-text="repEnabledCount"></span>)</button>
            </div>
            <div class="msg ok" x-show="rep.msg" x-text="rep.msg"></div>
            <div class="msg err" x-show="rep.err" x-text="rep.err"></div>

            <template x-if="rep.cfg">
            <div class="grid" style="grid-template-columns:380px 1fr;margin-top:16px" id="rep-grid">
              <div>
                <div class="card">
                  <h3>Invio automatico</h3>
                  <label class="check" style="margin-bottom:10px"><input type="checkbox" x-model="rep.cfg.enabled" @change="rep.dirty=true"> Invia il report ogni mese</label>
                  <div class="row" style="gap:8px">
                    <div class="field" style="flex:1"><label>Giorno</label><input class="input" type="number" min="1" max="28" x-model.number="rep.cfg.send_day" @change="rep.dirty=true"></div>
                    <div class="field" style="flex:1"><label>Ora</label><input class="input" type="number" min="0" max="23" x-model.number="rep.cfg.send_hour" @change="rep.dirty=true"></div>
                  </div>
                  <div class="field"><label>Indirizzo a cui inviare i report</label><input class="input" type="email" x-model="rep.cfg.recipients" @input="rep.dirty=true" placeholder="reports@example.com"><div class="hint">Tutti i report (globale e per cartella) arrivano qui. Vuoto = destinatario impostato nel file <span class="mono">.env</span>.</div></div>
                  <div class="hint">Il report copre sempre il mese <b>precedente</b>: il giorno 1 ricevi quello appena concluso.</div>
                </div>

                <div class="card" style="margin-top:14px">
                  <h3>Report da inviare ogni mese</h3>
                  <div class="small mut" style="margin-bottom:8px">Un PDF separato per ogni cartella spuntata, più eventualmente quello globale. Arrivano tutti nella stessa email di destinazione, come allegati distinti.</div>
                  <template x-for="s in rep.scopes" :key="s.key">
                    <div style="padding:8px 0;border-bottom:1px solid var(--bd)">
                      <label class="check"><input type="checkbox" x-model="s.enabled" @change="syncScopes()">
                        <span style="flex:1" x-text="s.label"></span><span class="badge" x-text="s.sites+' siti'"></span></label>
                    </div>
                  </template>
                  <div class="small mut" style="margin-top:8px" x-show="!repEnabledCount">Nessun report attivo: l'invio automatico non partirà.</div>
                </div>

                <div class="card" style="margin-top:14px">
                  <h3>Intestazione</h3>
                  <div class="field"><label>Ragione sociale</label><input class="input" x-model="rep.cfg.company" @input="repTouch()"></div>
                  <div class="field"><label>Titolo del report</label><input class="input" x-model="rep.cfg.title" @input="repTouch()"></div>
                  <div class="field"><label>Testo introduttivo</label><textarea class="input" rows="3" x-model="rep.cfg.intro" @input.debounce.500ms="repTouch()"></textarea></div>
                  <div class="field"><label>Nota a piè di pagina</label><input class="input" x-model="rep.cfg.footer" @input.debounce.500ms="repTouch()"></div>
                  <div class="hint">Il logo è quello caricato in <a href="#/settings">Impostazioni → Branding</a>.</div>
                </div>

                <div class="card" style="margin-top:14px">
                  <h3>Cosa includere</h3>
                  <label class="check" style="padding:4px 0"><input type="checkbox" x-model="rep.cfg.show_summary" @change="repTouch()"> Riepilogo del periodo</label>
                  <label class="check" style="padding:4px 0"><input type="checkbox" x-model="rep.cfg.show_sites" @change="repTouch()"> Dettaglio per sito (componenti e quante volte)</label>
                  <label class="check" style="padding:4px 0"><input type="checkbox" x-model="rep.cfg.show_top" @change="repTouch()"> Componenti più aggiornati</label>
                  <label class="check" style="padding:4px 0"><input type="checkbox" x-model="rep.cfg.show_failed" @change="repTouch()"> Aggiornamenti non riusciti</label>
                  <label class="check" style="padding:4px 0"><input type="checkbox" x-model="rep.cfg.show_compare" @change="repTouch()"> Confronto col mese precedente</label>
                  <label class="check" style="padding:4px 0"><input type="checkbox" x-model="rep.cfg.show_security" @change="repTouch()"> Stato sicurezza</label>
                  <label class="check" style="padding:4px 0"><input type="checkbox" x-model="rep.cfg.show_expiries" @change="repTouch()"> Scadenze in arrivo</label>
                  <div class="field" style="margin-top:10px" x-show="rep.cfg.show_expiries"><label>Orizzonte scadenze (giorni)</label><input class="input" type="number" min="7" max="365" x-model.number="rep.cfg.expiry_horizon_days" @change="repTouch()"></div>
                </div>

                <div class="card" style="margin-top:14px">
                  <div class="row"><h3 style="margin:0;flex:1">Layout PDF (avanzato)</h3><label class="check"><input type="checkbox" x-model="rep.advanced" @change="previewReport()"> modifica HTML</label></div>
                  <template x-if="rep.advanced">
                    <div style="margin-top:10px">
                      <textarea class="input mono" rows="14" x-model="rep.template" @input.debounce.700ms="repTouch()"></textarea>
                      <div class="hint">Jinja + CSS di stampa. Variabili: <span class="mono">period_label, total_updates, sites_touched, distinct_items, total_failed, sites[] (name, url, cms_label, total, components[]), top_items[], failed_items[], security, domains[], licenses[], cfg, logo</span>.</div>
                      <button class="btn sm ghost" style="margin-top:8px" @click="resetReportTemplate()">Ripristina layout predefinito</button>
                    </div>
                  </template>
                </div>

                <div class="row" style="margin-top:14px">
                  <button class="btn primary" :disabled="rep.busy||!rep.dirty" @click="saveReportCfg()">Salva impostazioni</button>
                  <span class="small mut" x-show="!rep.dirty">Nessuna modifica</span>
                </div>
                <div class="card" style="margin-top:14px">
                  <h3>Email di accompagnamento</h3>
                  <div class="small mut">Oggetto e testo dell'email a cui è allegato il PDF si modificano in <a href="#/notifications">Notifiche → Report mensile</a>.</div>
                </div>
              </div>

              <div>
                <div class="card">
                  <div class="row" style="flex-wrap:wrap"><h3 style="margin:0;flex:1">Anteprima — <span x-text="repScopeLabel"></span> · <span x-text="repPeriodLabel"></span></h3><span class="spinner" x-show="rep.busy"></span><button class="btn sm ghost" @click="openPreviewFull(rep.html)">⤢ A tutta pagina</button></div>
                  <div style="background:#fff;border-radius:8px;overflow:hidden;margin-top:10px">
                    <iframe :srcdoc="rep.html" sandbox="allow-same-origin" style="width:100%;height:600px;border:0;background:#fff;display:block" @load="fitFrame($event.target, 400, 30000)"></iframe>
                  </div>
                </div>
              </div>
            </div>
            </template>

            <div class="card" style="margin-top:16px" x-show="rep.trend">
              <div class="row" style="flex-wrap:wrap">
                <h3 style="margin:0;flex:1">Confronto mensile — <span x-text="rep.trend&&rep.trend.scope_label"></span></h3>
                <span class="small mut">totale <b x-text="rep.trend&&rep.trend.total"></b> · media <b x-text="rep.trend&&rep.trend.avg"></b>/mese</span>
                <select class="input" style="max-width:130px" x-model.number="rep.trendMonths" @change="loadTrend()">
                  <option value="6">6 mesi</option><option value="12">12 mesi</option><option value="24">24 mesi</option>
                </select>
              </div>
              <div class="bars" style="height:150px;margin-top:12px">
                <template x-for="m in (rep.trend?rep.trend.months:[])" :key="m.period">
                  <div class="b" :title="m.label+': '+m.updates+' aggiornamenti su '+m.sites+' siti'" style="cursor:pointer" @click="rep.period=m.period;repScopeChanged()">
                    <div class="bv" x-show="m.updates" x-text="m.updates"></div>
                    <div class="seg ok" :style="'height:'+trendBarH(m)+';opacity:'+(m.period===rep.period?1:.65)"></div>
                    <div class="lb" x-text="m.label.split(' ')[0].slice(0,3)+' '+m.label.split(' ')[1].slice(2)"></div>
                  </div>
                </template>
              </div>
              <div class="tbl-wrap" style="margin-top:14px">
                <table class="tbl responsive">
                  <thead><tr><th>Mese</th><th class="n">Aggiornamenti</th><th class="n">Variazione</th><th class="n">Siti</th><th class="n">Componenti</th><th class="n">Non riusciti</th></tr></thead>
                  <tbody>
                    <template x-for="m in (rep.trend?[...rep.trend.months].reverse():[])" :key="'r'+m.period">
                      <tr class="row" :class="m.period===rep.period?'selected':''" @click="rep.period=m.period;repScopeChanged()">
                        <td><b x-text="m.label"></b></td>
                        <td class="num" x-text="m.updates"></td>
                        <td class="num"><span :class="deltaCls(m)" x-text="deltaTxt(m)"></span></td>
                        <td class="num hide-m" x-text="m.sites"></td>
                        <td class="num hide-m" x-text="m.components"></td>
                        <td class="num"><span :class="m.failed?'err':'mut'" x-text="m.failed"></span></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <div class="small mut" style="margin-top:8px">Clicca un mese per aprirne il report. Il PDF include anche il confronto col mese precedente (disattivabile in «Cosa includere»).</div>
            </div>
          </div>
        </template>

        <!-- ===== NOTIFICHE ===== -->
        <template x-if="route.page==='notifications'">
          <div>
            <h1 class="page-title">Notifiche</h1>
            <div class="page-sub">Modifica i messaggi direttamente in modalità visuale e controlla subito come arriveranno davvero. Le variabili tra <span class="mono">{{ }}</span> vengono sostituite al momento dell'invio.</div>
            <div class="grid" style="grid-template-columns:280px 1fr;margin-top:16px" id="notif-grid">
              <div class="card" style="padding:8px">
                <template x-for="e in notif.events" :key="e.event">
                  <div class="nav"><div class="item" :class="notif.cur&&notif.cur.event===e.event?'on':''" @click="selNotif(e.event)" style="align-items:flex-start">
                    <span class="dot" :class="e.config.enabled?(e.config.email||e.config.telegram?'ok':'mut'):'mut'" style="margin-top:6px"></span>
                    <div style="flex:1;min-width:0"><div x-text="e.label"></div><div class="small mut" style="white-space:normal" x-text="[e.config.email?'email':'',e.config.telegram?'telegram':''].filter(Boolean).join(' + ')||'nessun canale'"></div></div>
                  </div></div>
                </template>
              </div>

              <template x-if="notif.cur && notif.edit">
              <div>
                <div class="card">
                  <div class="row" style="flex-wrap:wrap;gap:14px">
                    <div style="flex:1;min-width:200px"><b x-text="notif.cur&&notif.cur.label"></b><div class="small mut" x-text="notif.cur&&notif.cur.desc"></div></div>
                    <label class="check"><input type="checkbox" x-model="notif.edit.enabled"> Attivo</label>
                    <label class="check"><input type="checkbox" x-model="notif.edit.email"> Email</label>
                    <label class="check"><input type="checkbox" x-model="notif.edit.telegram"> Telegram</label>
                  </div>
                </div>

                <div class="notif-studio" style="margin-top:14px">
                  <div class="card notif-editor-card">
                    <div class="row" style="flex-wrap:wrap;margin-bottom:12px">
                      <div>
                        <h3 style="margin:0 0 3px">Editor visuale</h3>
                        <div class="small mut">Clicca direttamente nel messaggio per modificarlo.</div>
                      </div>
                      <div class="sp"></div>
                      <button class="btn sm ghost" x-show="notif.tab!=='subject'" @click="notif.source=!notif.source; if(!notif.source) $nextTick(()=>loadNotifEditors(true))" x-text="notif.source?'Torna al visuale':'HTML avanzato'"></button>
                    </div>

                    <div class="tabs notif-tabs">
                      <button :class="notif.tab==='email'?'on':''" @click="notif.tab='email'; notif.source=false; $nextTick(()=>loadNotifEditors())">Email</button>
                      <button :class="notif.tab==='telegram'?'on':''" @click="notif.tab='telegram'; notif.source=false; $nextTick(()=>loadNotifEditors())">Telegram</button>
                      <button :class="notif.tab==='subject'?'on':''" @click="notif.tab='subject'; notif.source=false">Oggetto email</button>
                    </div>

                    <div class="small mut" style="margin-bottom:6px">Variabili dinamiche — clicca per inserirle nel punto del cursore:</div>
                    <div class="chips notif-vars" style="margin-bottom:12px">
                      <template x-for="(d,v) in (notif.cur?notif.cur.vars:{})" :key="v"><span class="fchip" :title="d" @mousedown.prevent @click="insertVar(v)" x-text="'{{ '+v+' }}'"></span></template>
                    </div>

                    <div x-show="notif.tab==='subject'">
                      <div class="field" style="margin:0"><label>Oggetto dell'email</label><input id="nf_subject" class="input" x-model="notif.edit.subject" @input.debounce.350ms="previewNotif()" placeholder="Oggetto email"></div>
                    </div>

                    <div x-show="notif.tab!=='subject' && !notif.source">
                      <div class="wys-toolbar">
                        <button type="button" title="Grassetto" @click="formatNotif('bold')"><b>B</b></button>
                        <button type="button" title="Corsivo" @click="formatNotif('italic')"><i>I</i></button>
                        <button type="button" title="Sottolineato" x-show="notif.tab==='email'" @click="formatNotif('underline')"><u>U</u></button>
                        <span class="wys-sep"></span>
                        <button type="button" title="Allinea a sinistra" x-show="notif.tab==='email'" @click="formatNotif('justifyLeft')">≡</button>
                        <button type="button" title="Centra" x-show="notif.tab==='email'" @click="formatNotif('justifyCenter')">≡</button>
                        <button type="button" title="Allinea a destra" x-show="notif.tab==='email'" @click="formatNotif('justifyRight')">≡</button>
                        <span class="wys-sep" x-show="notif.tab==='email'"></span>
                        <button type="button" title="Elenco puntato" x-show="notif.tab==='email'" @click="formatNotif('insertUnorderedList')">• Lista</button>
                        <button type="button" title="Elenco numerato" x-show="notif.tab==='email'" @click="formatNotif('insertOrderedList')">1. Lista</button>
                        <span class="wys-sep"></span>
                        <button type="button" title="Inserisci link" @click="notifLink()">🔗 Link</button>
                        <label class="wys-color" x-show="notif.tab==='email'" title="Colore testo"><span>A</span><input type="color" value="#172033" @input="notifColor($event.target.value)"></label>
                        <button type="button" title="Rimuovi formattazione" @click="formatNotif('removeFormat')">Tx</button>
                      </div>

                      <div x-show="notif.tab==='email'" class="wys-shell email-shell">
                        <div class="wys-email-subject"><span class="mut">Oggetto:</span> <b x-text="notif.edit&&notif.edit.subject"></b></div>
                        <div id="nf_visual_email" class="wys-editor email-editor" contenteditable="true" spellcheck="true"
                             x-init="$nextTick(() => loadNotifEditors(true))"
                             @focus="notifRememberSelection('email')" @keyup="notifRememberSelection('email')" @mouseup="notifRememberSelection('email')"
                             @input.debounce.300ms="notifEditorInput('email')"></div>
                      </div>

                      <div x-show="notif.tab==='telegram'" class="tg-editor-wrap">
                        <div class="tg-phone">
                          <div class="tg-top">Telegram · Sentinel TD</div>
                          <div id="nf_visual_telegram" class="wys-editor telegram-editor" contenteditable="true" spellcheck="true"
                               x-init="$nextTick(() => loadNotifEditors(true))"
                               @focus="notifRememberSelection('telegram')" @keyup="notifRememberSelection('telegram')" @mouseup="notifRememberSelection('telegram')"
                               @input.debounce.300ms="notifEditorInput('telegram')"></div>
                        </div>
                        <div class="small mut" style="margin-top:7px">Telegram supporta grassetto, corsivo, codice e link. Le altre formattazioni vengono semplificate automaticamente.</div>
                      </div>
                    </div>

                    <div x-show="notif.tab!=='subject' && notif.source">
                      <div class="msg info" style="margin-top:0">Modalità avanzata: qui puoi intervenire sul codice. Tornando al visuale l'editor viene aggiornato automaticamente.</div>
                      <textarea id="nf_body_email" class="input mono" rows="18" x-show="notif.tab==='email'" x-model="notif.edit.body_email" @input.debounce.350ms="previewNotif()"></textarea>
                      <textarea id="nf_body_telegram" class="input mono" rows="14" x-show="notif.tab==='telegram'" x-model="notif.edit.body_telegram" @input.debounce.350ms="previewNotif()"></textarea>
                    </div>

                    <div class="row" style="margin-top:14px;flex-wrap:wrap">
                      <button class="btn primary" :disabled="notif.busy||!notifDirty" @click="saveNotif()">Salva modifiche</button>
                      <button class="btn" :disabled="notif.busy" @click="testNotif()">Invia test reale</button>
                      <button class="btn ghost" @click="resetNotif()">Ripristina default</button>
                      <div class="sp"></div>
                      <span class="msg ok" style="margin:0" x-show="notif.msg" x-text="notif.msg"></span><span class="msg err" style="margin:0" x-show="notif.err" x-text="notif.err"></span>
                    </div>
                  </div>

                  <div class="card notif-preview-card" x-show="notif.preview">
                    <div class="row" style="flex-wrap:wrap;margin-bottom:12px">
                      <div><h3 style="margin:0 0 3px">Anteprima reale</h3><div class="small mut">Dati di esempio già sostituiti: questo è l'aspetto finale del messaggio.</div></div>
                      <div class="sp"></div>
                      <div class="tabs preview-tabs" style="margin:0"><button :class="notif.previewTab==='email'?'on':''" @click="notif.previewTab='email'">Email</button><button :class="notif.previewTab==='telegram'?'on':''" @click="notif.previewTab='telegram'">Telegram</button></div>
                    </div>
                    <div class="msg err" x-show="notif.preview&&notif.preview.error" x-text="notif.preview&&notif.preview.error"></div>

                    <div x-show="notif.previewTab==='email'" class="mail-preview">
                      <div class="mail-meta"><div><span>Da</span><b>Sentinel TD</b></div><div><span>Oggetto</span><b x-text="notif.preview&&notif.preview.subject"></b></div></div>
                      <iframe class="notif-email-frame" sandbox="allow-same-origin" :srcdoc="emailPreviewDoc()" title="Anteprima email" @load="fitFrame($event.target, 200, 2400)"></iframe>
                    </div>

                    <div x-show="notif.previewTab==='telegram'" class="tg-preview-stage">
                      <div class="tg-preview-phone">
                        <div class="tg-preview-head"><div class="tg-avatar">S</div><div><b>Sentinel TD</b><div class="small">bot</div></div></div>
                        <div class="tg-bubble" x-html="notif.preview&&notif.preview.body_telegram"></div>
                        <div class="tg-time">ora ✓✓</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              </template>
            </div>
          </div>
        </template>

        <!-- ===== ACCOUNT ===== -->
        <template x-if="route.page==='account'">
          <div>
            <h1 class="page-title">Account</h1>
            <div class="page-sub">Credenziali e sicurezza dell'accesso a Sentinel TD.</div>
            <div class="grid two" style="margin-top:16px">
              <div class="card">
                <h3>Credenziali</h3>
                <div class="field"><label>Username</label><div class="row"><input class="input" x-model="account.username" placeholder="admin"><button class="btn sm" @click="saveUsername()">Salva</button></div></div>
                <div class="field"><label>Cambia password</label><input class="input" type="password" x-model="account.oldPw" placeholder="Password attuale" style="margin-bottom:6px"><div class="row"><input class="input" type="password" x-model="account.newPw" placeholder="Nuova password"><button class="btn sm" @click="savePassword()">Salva</button></div></div>
                <div class="msg ok" x-show="account.msg" x-text="account.msg"></div><div class="msg err" x-show="account.err" x-text="account.err"></div>
              </div>
              <div class="card">
                <h3>Verifica in due passaggi</h3>
                <div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><div style="flex:1"><b>Authenticator (TOTP)</b><div class="small mut">Google Authenticator, Authy, 1Password…</div></div><span class="badge" :class="sec2fa.totp?'ok':''" x-text="sec2fa.totp?'attivo':'non attivo'"></span><button class="btn sm" x-show="!sec2fa.totp&&!sec2fa.setup" @click="totpSetup()">Configura</button><button class="btn sm danger" x-show="sec2fa.totp" @click="totpDisable()">Disattiva</button></div>
                <template x-if="sec2fa.setup"><div style="padding:12px 0;border-bottom:1px solid var(--bd)"><div class="small mut" style="margin-bottom:8px">Inquadra il QR con l'app, poi inserisci il codice per confermare.</div><div style="background:#fff;border-radius:10px;padding:10px;width:190px" x-html="sec2fa.setup.qr_svg"></div><div class="small mut" style="margin:8px 0">Chiave manuale: <span class="mono" x-text="sec2fa.setup.secret"></span></div><div class="row"><input class="input mono" x-model="sec2fa.code" placeholder="123456" inputmode="numeric" style="max-width:160px"><button class="btn sm primary" @click="totpEnable()">Attiva</button><button class="btn sm ghost" @click="sec2fa.setup=null">Annulla</button></div></div></template>
                <div class="row" style="padding:8px 0"><div style="flex:1"><b>Passkey</b><div class="small mut">Face ID, Touch ID, Windows Hello, chiavi hardware</div></div><button class="btn sm" @click="passkeyRegister()">+ Aggiungi</button></div>
                <template x-for="p in sec2fa.passkeys" :key="p.id"><div class="row small" style="padding:5px 0 5px 12px"><span style="flex:1" x-text="p.label"></span><button class="btn sm ghost danger" @click="passkeyDelete(p.id)">rimuovi</button></div></template>
                <div class="msg ok" x-show="sec2fa.msg" x-text="sec2fa.msg"></div><div class="msg err" x-show="sec2fa.err" x-text="sec2fa.err"></div>
              </div>
            </div>
          </div>
        </template>

        <!-- ===== SETTINGS (ULTIMA VOCE MENU) ===== -->
        <template x-if="route.page==='settings'">
          <div>
            <h1 class="page-title">Impostazioni</h1>
            <div class="page-sub">Configurazione operativa di Sentinel TD. Password, token SMTP e segreti restano fuori da questa pagina.</div>
            <div class="grid two" style="margin-top:16px">
              <div>
                <div class="card">
                  <h3>Scadenze e avvisi</h3>
                  <div class="field"><label>Avvisi scadenza domini</label><input class="input" x-model="prefs.domain_alert_text" placeholder="30, 14, 7"><div class="hint">Giorni prima della scadenza, separati da virgola. Esempio: 60, 30, 14, 7.</div></div>
                  <div class="field"><label>Avvisi plugin / temi / licenze</label><input class="input" x-model="prefs.component_alert_text" placeholder="30, 14, 7"><div class="hint">Puoi usare soglie diverse da quelle dei domini.</div></div>
                  <div class="grid two compact-grid">
                    <div class="field"><label>Riscansiona registri ogni</label><div class="input-suffix"><input class="input" type="number" min="1" max="90" x-model.number="prefs.domain_scan_days"><span>giorni</span></div></div>
                    <div class="field"><label>Lookup domini simultanei</label><input class="input" type="number" min="1" max="8" x-model.number="prefs.domain_parallel_lookups"></div>
                    <div class="field"><label>Aggiorna anteprime siti ogni</label><div class="input-suffix"><input class="input" type="number" min="1" max="720" x-model.number="prefs.screenshot_every_hours"><span>ore</span></div>
                      <button class="btn sm" style="margin-top:6px" @click="shootBulk(false)">🖼 Rigenera tutte adesso</button></div>
                    <div class="field"><label>Soglia gialla</label><div class="input-suffix"><input class="input" type="number" min="1" x-model.number="prefs.expiry_warning_days"><span>giorni</span></div></div>
                    <div class="field"><label>Soglia rossa</label><div class="input-suffix"><input class="input" type="number" min="1" x-model.number="prefs.expiry_critical_days"><span>giorni</span></div></div>
                  </div>
                  <div class="row" style="margin-top:8px"><button class="btn primary" :disabled="prefs.busy" @click="savePrefs()">Salva impostazioni scadenze</button><span class="msg ok" style="margin:0" x-show="prefs.msg" x-text="prefs.msg"></span><span class="msg err" style="margin:0" x-show="prefs.err" x-text="prefs.err"></span></div>
                </div>
                <div class="card" style="margin-top:16px">
                  <h3>Branding</h3>
                  <div class="brand-preview"><img :src="brand.logo_url" alt="Logo"><div><b>Logo applicazione</b><div class="small mut" x-text="brand.custom_logo?'Personalizzato':'Automatico dal logo incluso nel pacchetto'"></div></div></div>
                  <div class="row" style="margin:10px 0 18px;flex-wrap:wrap"><label class="btn sm">Scegli logo<input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" style="display:none" @change="uploadBrand('logo',$event)"></label><button class="btn sm ghost" x-show="brand.custom_logo" @click="resetBrand('logo')">Ripristina incluso</button></div>
                  <div class="brand-preview favicon-preview"><img :src="brand.favicon_url" alt="Favicon"><div><b>Favicon</b><div class="small mut" x-text="brand.custom_favicon?'Personalizzata':'Automatica dalla favicon inclusa nel pacchetto'"></div></div></div>
                  <div class="row" style="margin-top:10px;flex-wrap:wrap"><label class="btn sm">Scegli favicon<input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/x-icon" style="display:none" @change="uploadBrand('favicon',$event)"></label><button class="btn sm ghost" x-show="brand.custom_favicon" @click="resetBrand('favicon')">Ripristina inclusa</button></div>
                </div>
              </div>
              <div>
                <div class="card">
                  <h3>Connettori</h3>
                  <template x-for="c in conn.list" :key="c.kind"><div class="row" style="padding:10px 0;border-bottom:1px solid var(--bd)"><span class="cms" :class="c.kind==='wp'?'wp':'joomla'" x-text="c.kind==='wp'?'WP':'JOOMLA'"></span><div style="flex:1"><div x-text="c.kind==='wp'?'td-panopticon':'plg_system_tdpanopticon'"></div><div class="small mut" x-show="c.present"><span x-show="c.version" x-text="'v'+c.version+' · '"></span><span x-text="fmtDate(c.mtime*1000)"></span></div><div class="small mut" x-show="!c.present">non caricato</div></div><button class="btn sm" x-show="c.present" @click="downloadConn(c.kind)">Scarica</button><label class="btn sm"><span x-text="c.present?'Sostituisci':'Carica'"></span><input type="file" accept=".zip" style="display:none" :disabled="conn.busy" @change="uploadConn(c.kind,$event)"></label></div></template>
                  <div class="msg ok" x-show="conn.msg" x-text="conn.msg"></div><div class="msg err" x-show="conn.err" x-text="conn.err"></div>
                  <h3 style="margin-top:20px">Registrazione automatica (WordPress)</h3><div class="small mut" style="margin-bottom:8px">Chiave da mettere nella costante <span class="mono">TDPANOP_HUB_KEY</span> del connettore.</div><div class="row"><input class="input mono small" readonly :value="conn.regKey" onclick="this.select()"><button class="btn sm" @click="copy(conn.regKey)">Copia</button><button class="btn sm" @click="rotateKey()">Rigenera</button></div>
                </div>
                <div class="card" style="margin-top:16px"><h3>Notifiche</h3><div class="row"><div class="small mut" style="flex:1">Testi, HTML, anteprime e canali si modificano nella pagina <a href="#/notifications">Notifiche</a>. SMTP e token Telegram restano nel file <span class="mono">.env</span>.</div><button class="btn sm" @click="telegramTest()">Test Telegram</button></div></div>
              </div>
            </div>
          </div>
        </template>
      </main>
    </div>
  </div>
</template>

<!-- ===================== DRAWER: PLUGIN / TEMA / LICENZA GLOBALE ===================== -->
<template x-if="token&&expiryEdit">
  <div><div class="overlay" @click="expiryEdit=false"></div>
  <div class="drawer" @keydown.escape.window="expiryEdit=false">
    <div class="head"><h2 x-text="expiryForm.id?'Modifica scadenza':'Aggiungi plugin / tema / licenza'"></h2><div class="sp"></div><button class="btn icon ghost" @click="expiryEdit=false">✕</button></div>
    <div class="body">
      <div class="field"><label>Plugin / tema / licenza</label><input class="input" x-model="expiryForm.name" placeholder="es. YOOtheme Pro, Akeeba Pro, WP Rocket"></div>
      <div class="field"><label>Piattaforma</label><select class="input" x-model="expiryForm.platform"><option value="wp">WordPress</option><option value="joomla">Joomla</option><option value="both">WordPress + Joomla / Entrambi</option></select><div class="hint">Non viene associato a un singolo sito.</div></div>
      <div class="field"><label>Fornitore</label><input class="input" x-model="expiryForm.provider" placeholder="es. YOOtheme, Akeeba, WP Media"></div>
      <div class="field"><label>Data scadenza / rinnovo</label><input class="input" type="date" x-model="expiryForm.date"></div>
      <div class="field"><label>Ricorrenza</label>
        <select class="input" x-model.number="expiryForm.recur">
          <option value="0">Una tantum (nessun rinnovo)</option>
          <option value="1">Mensile</option>
          <option value="3">Trimestrale</option>
          <option value="6">Semestrale</option>
          <option value="12">Annuale</option>
          <option value="24">Biennale</option>
          <option value="-1">Personalizzata (ogni N mesi)</option>
        </select>
        <div class="row" x-show="expiryForm.recur===-1" style="margin-top:6px"><span class="small mut">ogni</span><input class="input" type="number" min="1" max="120" x-model.number="expiryForm.recurCustom" style="max-width:90px"><span class="small mut">mesi</span></div>
        <div class="hint">Con una ricorrenza, il bottone «Rinnovata» sposta la scadenza avanti di un periodo e riarma gli avvisi.</div>
      </div>
      <div class="field"><label>Note</label><textarea class="input" rows="4" x-model="expiryForm.notes" placeholder="Piano, account, rinnovo automatico, riferimenti…"></textarea></div>
      <div class="msg err" x-show="expiryErr" x-text="expiryErr"></div>
      <div class="small mut">Gli avvisi seguono le soglie configurate in Impostazioni → Scadenze e avvisi.</div>
    </div>
    <div class="foot"><button class="btn" @click="expiryEdit=false">Annulla</button><button class="btn primary" @click="saveExpiry()">Salva</button></div>
  </div></div>
</template>

<!-- ===================== DRAWER: SITO ===================== -->
<template x-if="token&&drawer==='site'">
  <div><div class="overlay" @click="drawer=null"></div>
  <div class="drawer" @keydown.escape.window="drawer=null">
    <div class="head"><h2 x-text="form.id?'Modifica sito':'Nuovo sito'"></h2><div class="sp"></div><button class="btn icon ghost" @click="drawer=null">✕</button></div>
    <div class="body">
      <div class="field"><label>Nome</label><input class="input" x-model="form.name"></div>
      <div class="field"><label>URL (senza slash finale)</label><input class="input" x-model="form.url" placeholder="https://sito.it"></div>
      <div class="field"><label>CMS</label><select class="input" x-model="form.cms"><option value="wp">WordPress</option><option value="joomla">Joomla</option></select></div>
      <div class="field"><label>Token del connettore</label><input class="input mono" x-model="form.token"><div class="hint">Lo trovi nella pagina del connettore sul sito (o si compila da solo con la registrazione automatica).</div></div>
      <div class="field"><label>URL admin</label><input class="input" x-model="form.admin_url" placeholder="/wp-admin oppure /login (WPS Hide Login)"></div>
      <div class="field"><label>Cartelle (separate da virgola)</label><input class="input" x-model="form.tags" list="tagsdl" placeholder="Clienti interni, ClienteX/Shop"><datalist id="tagsdl"><template x-for="t in allTags" :key="t"><option :value="t"></option></template></datalist><div class="hint">Usa <span class="mono">Padre/Figlio</span> per le sottocartelle.</div></div>
      <div class="field"><label>Intervallo check (minuti)</label><input class="input" type="number" min="15" x-model.number="form.poll_interval_minutes"></div>
      <label class="check"><input type="checkbox" x-model="form.auto_update"> Aggiornamenti automatici</label>
      <label class="check" style="margin-top:8px"><input type="checkbox" x-model="form.notifications_silenced"> 🔕 Silenzia tutte le notifiche di questo sito</label>
      <div class="hint" style="margin:4px 0 8px 24px">Il monitoraggio e gli update continuano; vengono sospesi solo email/Telegram, comprese scadenze e vulnerabilità.</div>
      <label class="check" style="margin-top:8px"><input type="checkbox" x-model="form.enabled"> Sito abilitato (monitoraggio attivo)</label>
      <div class="msg err" x-show="formErr" x-text="formErr"></div>
    </div>
    <div class="foot"><button class="btn" @click="drawer=null">Annulla</button><button class="btn primary" @click="saveSite()">Salva</button></div>
  </div></div>
</template>

<!-- ===================== DRAWER: CARTELLE (bulk) ===================== -->
<template x-if="token&&drawer==='tags'">
  <div><div class="overlay" @click="drawer=null"></div>
  <div class="drawer" @keydown.escape.window="drawer=null">
    <div class="head"><h2>Cartelle · <span x-text="selIds.length+' siti'"></span></h2><div class="sp"></div><button class="btn icon ghost" @click="drawer=null">✕</button></div>
    <div class="body">
      <div class="field"><label>Aggiungi a</label><input class="input" x-model="tagsForm.add" list="tagsdl2" placeholder="ClienteX"><datalist id="tagsdl2"><template x-for="t in allTags" :key="t"><option :value="t"></option></template></datalist></div>
      <div class="field"><label>Rimuovi da</label><input class="input" x-model="tagsForm.remove" placeholder="Vecchia cartella"></div>
      <div class="hint">Più cartelle separate da virgola. I siti possono stare in più cartelle.</div>
    </div>
    <div class="foot"><button class="btn" @click="drawer=null">Annulla</button><button class="btn primary" @click="saveTags()">Applica</button></div>
  </div></div>
</template>

<!-- ===================== DRAWER: INSTALLA / RIMUOVI ===================== -->
<template x-if="token&&drawer==='install'">
  <div><div class="overlay" @click="drawer=null"></div>
  <div class="drawer" style="width:min(680px,100vw)" @keydown.escape.window="drawer=null">
    <div class="head">
      <div class="tabs" style="margin:0;border:none"><button :class="inst.mode==='install'?'on':''" @click="inst.mode='install'">Installa</button><button :class="inst.mode==='remove'?'on':''" @click="inst.mode='remove'">Rimuovi</button></div>
      <div class="sp"></div><button class="btn icon ghost" @click="drawer=null">✕</button>
    </div>
    <div class="body">
      <div class="field"><label>Piattaforma</label><select class="input" x-model="inst.cms" @change="inst.sel=[];inst.results=[];inst.rmItems=[]"><option value="wp">WordPress</option><option value="joomla">Joomla</option></select></div>

      <template x-if="inst.mode==='install'">
        <div>
          <div class="field"><label>Pacchetto (.zip)</label><input type="file" accept=".zip" @change="inst.file=$event.target.files[0]"></div>
          <div class="row" x-show="inst.cms==='wp'"><div class="field" style="flex:1"><label>Tipo</label><select class="input" x-model="inst.kind"><option value="plugin">Plugin</option><option value="theme">Tema</option></select></div><label class="check" style="margin-top:14px"><input type="checkbox" x-model="inst.activate"> Attiva dopo l'installazione</label></div>
        </div>
      </template>

      <template x-if="inst.mode==='remove'">
        <div>
          <div class="field"><label>Cerca estensione</label><div class="row"><input class="input" x-model="inst.q" @keydown.enter="instSearch()" placeholder="nome o slug"><button class="btn" @click="instSearch()">Cerca</button></div></div>
          <div x-show="inst.searched&&!inst.results.length" class="empty">Nessun risultato</div>
          <template x-for="r in inst.results" :key="r.type+'|'+r.slug">
            <div style="border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px" :style="r.protected?'opacity:.5':''">
              <label class="check" style="align-items:flex-start">
                <input type="checkbox" :disabled="r.protected" :checked="instSelected(r)" @change="instToggle(r)" style="margin-top:3px">
                <div style="flex:1;min-width:0">
                  <div><b x-text="r.name"></b> <span class="badge" x-text="r.type"></span> <span class="badge" x-show="r.protected">protetto</span></div>
                  <div class="mono small mut" x-text="r.slug"></div>
                  <div class="small" x-show="(r.versions||[]).length"><span class="mut">versione:</span> <span x-text="(r.versions||[]).map(v=>'v'+v).join(' · ')"></span> <span class="badge warn" x-show="(r.versions||[]).length>1">miste</span></div>
                </div>
                <button type="button" class="btn sm ghost" @click.prevent.stop="instToggleOpen(r)" x-text="'su '+r.count+' siti '+(instIsOpen(r)?'▴':'▾')"></button>
              </label>
              <div x-show="instIsOpen(r)" style="padding:6px 0 0 28px">
                <template x-for="d in (r.site_details||[])" :key="d.id"><div class="row small" style="padding:2px 0"><span style="flex:1" x-text="d.name"></span><span class="mono" x-text="d.version?'v'+d.version:'—'"></span><span class="badge warn" x-show="d.update_available" x-text="'→ '+(d.new_version||'update')"></span></div></template>
              </div>
            </div>
          </template>
        </div>
      </template>

      <div class="row" style="margin:14px 0 6px"><label style="font-size:12px;color:var(--txt-2);font-weight:500">Siti di destinazione</label><div class="sp"></div><button class="btn sm ghost" @click="instToggleAll()">Seleziona tutti</button></div>
      <div style="max-height:220px;overflow:auto;border:1px solid var(--bd);border-radius:10px">
        <template x-for="s in instSites()" :key="s.id">
          <label class="check" style="padding:7px 12px;border-bottom:1px solid var(--bd)"><input type="checkbox" :checked="inst.sel.includes(s.id)" @change="inst.sel=inst.sel.includes(s.id)?inst.sel.filter(x=>x!==s.id):[...inst.sel,s.id]"><span class="dot" :class="isOff(s)?'err':'ok'"></span><span style="flex:1" x-text="s.name"></span><span class="small mut" x-text="s.url.replace(/^https?:\/\//,'')"></span></label>
        </template>
      </div>
      <div class="small mut" style="margin-top:6px" x-text="inst.sel.length+' siti selezionati'+(inst.mode==='remove'&&!inst.sel.length?' (vuoto = tutti quelli che hanno l\'estensione)':'')"></div>

      <template x-if="inst.out.length">
        <div style="margin-top:14px"><h3 class="small mut">Esito</h3>
          <template x-for="(o,i) in inst.out" :key="i"><div class="row small" style="padding:4px 0"><span class="dot" :class="o.ok?'ok':'err'"></span><span x-text="(o.site||o.site_name||o.name||'')+' — '+(o.message||o.error||(o.ok?'ok':'errore'))"></span></div></template>
        </div>
      </template>
    </div>
    <div class="foot"><button class="btn" @click="drawer=null">Chiudi</button><button class="btn primary" :disabled="inst.busy" @click="inst.mode==='install'?runInstall():runRemove()"><span class="spinner" x-show="inst.busy"></span> <span x-text="inst.mode==='install'?'Installa':'Rimuovi'"></span></button></div>
  </div></div>
</template>

<!-- anteprima report a tutta pagina -->
<template x-if="token&&previewFull">
  <div><div class="overlay" @click="previewFull=''"></div>
  <div style="position:fixed;inset:24px;z-index:43;background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)" @keydown.escape.window="previewFull=''">
    <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-2);border-bottom:1px solid var(--bd)">
      <b style="flex:1;font-size:13px">Anteprima report</b>
      <button class="btn sm" @click="openTokenLink(() => reportPdfUrl())">⬇ PDF</button>
      <button class="btn sm ghost" @click="previewFull=''">✕ Chiudi</button>
    </div>
    <iframe :srcdoc="previewFull" sandbox="allow-same-origin" style="flex:1;width:100%;border:0;background:#fff"></iframe>
  </div></div>
</template>

<div class="toast" x-show="toast" x-text="toast" x-transition></div>
</body>
</html>
